<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partyrequest - Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="style.js"></script>
</head>
<body>
    <div class="container" style="padding-top: 30px; max-width: 1000px;">
        <!-- Topbar -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <div>
                <h1 style="font-size: 28px; font-weight: 800; color: var(--primary-color);">Admin Dashboard</h1>
                <p style="font-size: 13px; color: #888; margin-top: 2px;">Beheer accounts, abonnementen en DJ's</p>
            </div>
            <button class="btn-primary" onclick="PartyApp.logout()" style="background: #ef4444; width: auto; padding: 10px 16px; font-size: 13px;">Uitloggen</button>
        </div>

        <!-- Live Tellers / Stats Grid -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 25px;">
            <div class="card" style="padding: 20px; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <span style="color: #888; font-size: 12px; font-weight: bold; display: block;">ACTIEVE PARTYCODES</span>
                    <span id="activeCodesCount" style="font-size: 24px; font-weight: bold; color: var(--accent-color);">0</span>
                </div>
                <span style="font-size: 28px;">🎟️</span>
            </div>
            <div class="card" style="padding: 20px; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <span style="color: #888; font-size: 12px; font-weight: bold; display: block;">TOTAAL ACCOUNTS</span>
                    <span id="totalAccountsCount" style="font-size: 24px; font-weight: bold; color: var(--primary-color);">0</span>
                </div>
                <span style="font-size: 28px;">👥</span>
            </div>
        </div>
        
        <!-- Hoofaccount Aanmaken Card -->
        <div class="card" style="margin-bottom: 25px;">
            <h3 style="margin-bottom: 15px; font-size: 18px;">Bedrijf of Solo DJ Aanmaken</h3>
            <form id="createUserForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Type Account:</label>
                        <select id="roleSelect">
                            <option value="company">Bedrijf</option>
                            <option value="solo_dj">Solo DJ</option>
                        </select>
                    </div>
                    <div>
                        <label>Abonnementsduur:</label>
                        <select id="subscriptionDuration">
                            <option value="1_month">1 Maand</option>
                            <option value="1_year" selected>1 Jaar</option>
                            <option value="2_years">2 Jaar</option>
                        </select>
                    </div>
                </div>
                
                <label>Gebruikersnaam:</label>
                <input type="text" id="newUsername" placeholder="Bijv. dj_mark of party-rent" required>
                
                <label>Wachtwoord:</label>
                <input type="password" id="newPassword" placeholder="Minimaal 6 tekens" required>
                
                <button type="submit" class="btn-primary" style="margin-top: 5px;">Account Aanmaken & Abonnement Starten</button>
            </form>
        </div>

        <!-- Account Beheer Card -->
        <div class="card">
            <h3 style="margin-bottom: 15px; font-size: 18px;">Beheer Accounts & DJ's</h3>
            <div id="userList">
                <p style="color: #888; text-align: center; padding: 15px;">Accounts laden...</p>
            </div>
        </div>
    </div>

    <script>
        const user = PartyApp.getCurrentUser();
        if (!user || user.role !== 'admin') {
            window.location.href = 'login.html';
        }

        let cachedUsers = [];

        async function loadAdminData() {
            const listDiv = document.getElementById('userList');
            listDiv.innerHTML = '<p style="color: #888; text-align: center; padding: 15px;">Data laden...</p>';
            
            try {
                cachedUsers = await PartyApp.db.getUsers();
                const sessions = await PartyApp.db.getAllSessions();

                document.getElementById('totalAccountsCount').innerText = cachedUsers.filter(u => u.role !== 'admin').length;
                document.getElementById('activeCodesCount').innerText = sessions.filter(s => s.party_code).length;

                listDiv.innerHTML = '';
                const managedUsers = cachedUsers.filter(u => u.role !== 'admin');
                
                if (managedUsers.length === 0) {
                    listDiv.innerHTML = '<p style="color: #888; text-align: center; padding: 15px;">Geen accounts gevonden.</p>';
                    return;
                }
                
                const now = new Date();
                const mainAccounts = managedUsers.filter(u => u.role === 'company' || u.role === 'solo_dj');
                const subDjs = managedUsers.filter(u => u.role === 'sub_dj' || u.role === 'company_dj');

                if (mainAccounts.length === 0 && subDjs.length === 0) {
                    listDiv.innerHTML = '<p style="color: #888; text-align: center; padding: 15px;">Geen accounts gevonden.</p>';
                    return;
                }

                mainAccounts.forEach((u) => {
                    let roleLabel = u.role === 'company' ? 'Bedrijf' : 'Solo DJ';

                    let expiresAt = u.expires_at ? new Date(u.expires_at) : new Date(now.getTime() + 365*24*60*60*1000);
                    let diffTime = expiresAt - now;
                    let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    let statusBadge = '';
                    let badgeColor = 'var(--accent-color)';

                    if (diffDays < 0) {
                        statusBadge = 'VERLOPEN (Inloggen geblokkeerd)';
                        badgeColor = 'var(--danger-color)';
                    } else if (diffDays <= 30) {
                        statusBadge = `Verloopt bijna over ${diffDays} dagen!`;
                        badgeColor = 'var(--warning-color)';
                    } else {
                        statusBadge = `Geldig nog ${diffDays} dagen (${expiresAt.toLocaleDateString('nl-NL')})`;
                    }

                    const children = subDjs.filter(sub => sub.company === u.username);

                    let expandButtonHtml = `<button onclick="toggleSubDjs('${u.username}', ${children.length})" id="btn-toggle-${u.username}" style="background: #334155; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px;">DJ's beheren (${children.length})</button>`;
                    
                    let childrenContainerHtml = `<div id="sub-djs-${u.username}" style="display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #1e293b;">`;
                    
                    // Bestaande DJ's tonen
                    if (children.length > 0) {
                        childrenContainerHtml += `<div style="margin-bottom: 12px;"><b style="font-size: 13px; color: #94a3b8;">Gekoppelde DJ's:</b></div>`;
                        children.forEach(child => {
                            childrenContainerHtml += `
                                <div style="background: #04060b; padding: 10px 14px; border-radius: 6px; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px dashed #1e293b;">
                                    <div>
                                        <span style="font-size: 13px;">↳ DJ: <b>${child.username}</b></span>
                                    </div>
                                    <div style="display: flex; gap: 6px;">
                                        <button onclick="promptChangePassword('${child.username}')" style="background: #1e3a8a; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;">Wachtwoord</button>
                                        <button onclick="deleteUserAccount('${child.username}')" style="background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;">Verwijderen</button>
                                    </div>
                                </div>`;
                        });
                    } else {
                        childrenContainerHtml += `<p style="font-size: 12px; color: #64748b; margin-bottom: 10px;">Nog geen DJ's gekoppeld aan ${u.username}.</p>`;
                    }

                    // Formulier om direct een DJ toe te voegen in deze uitgevouwen weergave
                    childrenContainerHtml += `
                        <div style="background: #0f172a; padding: 12px; border-radius: 8px; margin-top: 12px; border: 1px solid #1e293b;">
                            <b style="font-size: 12px; color: var(--primary-color);">+ Nieuwe DJ toevoegen aan ${u.username}</b>
                            <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-top: 8px;">
                                <input type="text" id="inline-user-${u.username}" placeholder="Gebruikersnaam DJ" style="margin: 0; padding: 8px; font-size: 12px;">
                                <input type="password" id="inline-pass-${u.username}" placeholder="Wachtwoord" style="margin: 0; padding: 8px; font-size: 12px;">
                                <button onclick="createSubDjInline('${u.username}', '${u.expires_at || ''}')" style="background: var(--primary-color); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;">Toevoegen</button>
                            </div>
                        </div>
                    `;

                    childrenContainerHtml += `</div>`;

                    listDiv.innerHTML += `
                        <div style="background: #090d16; padding: 15px 18px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #1e293b;">
                            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                                <div>
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        <b style="font-size: 16px;">${u.username}</b> 
                                        <span style="font-size: 11px; color: var(--primary-color); background: rgba(59,130,246,0.1); padding: 3px 8px; border-radius: 4px;">${roleLabel}</span>
                                    </div>
                                    <small style="color: ${badgeColor}; display: block; margin-top: 4px; font-weight: bold;">⚠️ ${statusBadge}</small>
                                </div>
                                <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
                                    ${expandButtonHtml}
                                    <button onclick="promptChangeExpiration('${u.username}', '${u.expires_at || ''}')" style="background: #059669; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px;">Vervaldatum</button>
                                    <button onclick="promptChangePassword('${u.username}')" style="background: #1e3a8a; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px;">Wachtwoord</button>
                                    <button onclick="deleteUserAccount('${u.username}')" style="background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px;">Verwijderen</button>
                                </div>
                            </div>
                            ${childrenContainerHtml}
                        </div>`;
                });

            } catch (err) {
                console.error("Fout bij laden admin data:", err);
                listDiv.innerHTML = '<p style="color: #ef4444; text-align: center; padding: 15px;">Fout bij laden van gegevens.</p>';
            }
        }

        window.toggleSubDjs = function(username, count) {
            const container = document.getElementById(`sub-djs-${username}`);
            const btn = document.getElementById(`btn-toggle-${username}`);
            if (container.style.display === 'none') {
                container.style.display = 'block';
                btn.innerText = 'DJ\'s inklappen';
            } else {
                container.style.display = 'none';
                btn.innerText = `DJ's beheren (${count})`;
            }
        };

        window.createSubDjInline = async function(parentUsername, parentExpiresAt) {
            const usernameInput = document.getElementById(`inline-user-${parentUsername}`);
            const passwordInput = document.getElementById(`inline-pass-${parentUsername}`);
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                alert('Vul zowel een gebruikersnaam als een wachtwoord in voor de DJ.');
                return;
            }

            try {
                const existingUsers = await PartyApp.db.getUsers();
                if (existingUsers.some(u => u.username === username)) {
                    alert('Deze gebruikersnaam bestaat al!');
                    return;
                }

                const expiresAt = parentExpiresAt || new Date(new Date().setFullYear(new Date().getFullYear() + 2)).toISOString();

                const success = await PartyApp.db.createUser({ 
                    username, 
                    password, 
                    role: 'company_dj', 
                    company: parentUsername, 
                    expires_at: expiresAt 
                });

                if (success) {
                    alert(`DJ ${username} succesvol toegevoegd aan ${parentUsername}!`);
                    loadAdminData();
                }
            } catch (err) {
                console.error("Fout bij aanmaken sub-DJ:", err);
                alert("Kon DJ niet aanmaken.");
            }
        };

        document.getElementById('createUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const role = document.getElementById('roleSelect').value;
            const duration = document.getElementById('subscriptionDuration').value;
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value.trim();

            if (!username || !password) {
                alert('Vul alle velden in.');
                return;
            }

            let expiresAt = new Date();
            if (duration === '1_month') expiresAt.setMonth(expiresAt.getMonth() + 1);
            if (duration === '1_year') expiresAt.setFullYear(expiresAt.getFullYear() + 1);
            if (duration === '2_years') expiresAt.setFullYear(expiresAt.getFullYear() + 2);

            try {
                const existingUsers = await PartyApp.db.getUsers();
                if (existingUsers.some(u => u.username === username)) {
                    alert('Deze gebruikersnaam bestaat al!');
                    return;
                }

                const success = await PartyApp.db.createUser({ 
                    username, 
                    password, 
                    role, 
                    company: null, 
                    expires_at: expiresAt.toISOString() 
                });

                if (success) {
                    alert('Account succesvol aangemaakt!');
                    document.getElementById('newUsername').value = '';
                    document.getElementById('newPassword').value = '';
                    loadAdminData();
                }
            } catch (err) {
                console.error("Fout bij aanmaken:", err);
                alert("Kon account niet aanmaken.");
            }
        });

        window.promptChangeExpiration = async function(username, currentExpiresAt) {
            let defaultDateStr = '';
            if (currentExpiresAt) {
                const d = new Date(currentExpiresAt);
                defaultDateStr = d.toISOString().split('T')[0];
            } else {
                const d = new Date();
                d.setFullYear(d.getFullYear() + 1);
                defaultDateStr = d.toISOString().split('T')[0];
            }

            const newDateStr = prompt(`Voer de nieuwe vervaldatum in voor ${username} (Formaat: JJJJ-MM-DD):`, defaultDateStr);
            if (newDateStr && newDateStr.trim() !== '') {
                const parsedDate = new Date(newDateStr);
                if (isNaN(parsedDate.getTime())) {
                    alert('Ongeldige datum ingevoerd! Gebruik het formaat JJJJ-MM-DD (bijv. 2027-08-07).');
                    return;
                }

                const success = await PartyApp.db.updateSubscription(username, parsedDate.toISOString());
                if (success) {
                    alert('Vervaldatum succesvol aangepast!');
                    loadAdminData();
                }
            }
        };

        window.deleteUserAccount = async function(username) {
            if (confirm(`Weet je zeker dat je ${username} wilt verwijderen?`)) {
                const success = await PartyApp.db.deleteUser(username);
                if (success) {
                    alert('Account verwijderd.');
                    loadAdminData();
                }
            }
        };

        window.promptChangePassword = async function(username) {
            const newPass = prompt(`Voer een nieuw wachtwoord in voor ${username}:`);
            if (newPass && newPass.trim() !== '') {
                const success = await PartyApp.db.updatePassword(username, newPass.trim());
                if (success) {
                    alert('Wachtwoord succesvol gewijzigd!');
                }
            }
        };

        setInterval(loadAdminData, 10000);
        loadAdminData();
    </script>
</body>
</html>
