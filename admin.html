<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super-Admin Dashboard | DJ Verzoekjes Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        h1, h2 {
            margin: 0;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-outline {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--text);
            background-color: rgba(79, 70, 229, 0.1);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, select {
            padding: 10px 12px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-bedrijf { background-color: rgba(79, 70, 229, 0.2); color: #818cf8; }
        .badge-dj { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; }

        .expired {
            color: var(--danger);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ Super-Admin Dashboard</h1>
            <button id="logout-btn" class="btn btn-outline">Uitloggen</button>
        </header>

        <!-- Formulier: Nieuw Bedrijf of DJ Toevoegen -->
        <div class="card">
            <h2>Nieuw Account Aanmaken</h2>
            <form id="create-company-form" style="margin-top: 16px;">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="company-name">Bedrijfs- of DJ Naam</label>
                        <input type="text" id="company-name" required placeholder="Bijv. DJ Tim of Club Lux">
                    </div>
                    <div class="form-group">
                        <label for="company-code">Unieke Code / Slug</label>
                        <input type="text" id="company-code" required placeholder="Bijv. dj-tim (zonder spaties)">
                    </div>
                    <div class="form-group">
                        <label for="account-type">Type Account</label>
                        <select id="account-type">
                            <option value="dj">Solo DJ</option>
                            <option value="bedrijf">Bedrijf</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="password">Wachtwoord</label>
                        <input type="text" id="password" required placeholder="Korte inlogcode">
                    </div>
                    <div class="form-group">
                        <label for="expires-at">Abonnement Geldig Tot</label>
                        <input type="date" id="expires-at" required>
                    </div>
                </div>
                <button type="submit" class="btn">Account Aanmaken</button>
            </form>
        </div>

        <!-- Overzicht van alle bestaande accounts -->
        <div class="card">
            <h2>Actieve Accounts</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Naam</th>
                            <th>Code (Slug)</th>
                            <th>Type</th>
                            <th>Wachtwoord</th>
                            <th>Verloopt op</th>
                            <th>Actie</th>
                        </tr>
                    </thead>
                    <tbody id="companies-table-body">
                        <tr>
                            <td colspan="6" style="text-align: center; color: var(--text-muted);">Gegevens laden...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. Beveiliging: Check of de super admin wel is ingelogd
        if (sessionStorage.getItem('super_admin_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }

        // Uitlog knop
        document.getElementById('logout-btn').addEventListener('click', () => {
            sessionStorage.removeItem('super_admin_logged_in');
            window.location.href = 'login.html';
        });

        // 2. Supabase Configuratie (zelfde gegevens)
        const SUPABASE_URL = 'https://yhitywueffetjjnoudkt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_UVo2rR8P1p3eH6Un0Mn1rw_4AnBv1po';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Standaard datum voor 'expires-at' zetten op over 1 jaar
        const nextYear = new Date();
        nextYear.setFullYear(nextYear.getFullYear() + 1);
        document.getElementById('expires-at').valueAsDate = nextYear;

        // 3. Haal alle bedrijven/DJ's op en toon ze in de tabel
        async function loadCompanies() {
            const tableBody = document.getElementById('companies-table-body');
            
            const { data, error } = await _supabase
                .from('companies')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--danger);">Fout bij laden: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Nog geen accounts aangemaakt.</td></tr>`;
                return;
            }

            tableBody.innerHTML = '';
            data.forEach(company => {
                const isExpired = company.expires_at && new Date() > new Date(company.expires_at);
                const badgeClass = company.account_type === 'bedrijf' ? 'badge-bedrijf' : 'badge-dj';
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${company.company_name}</strong></td>
                    <td><code>${company.company_code}</code></td>
                    <td><span class="badge ${badgeClass}">${company.account_type}</span></td>
                    <td>${company.password}</td>
                    <td class="${isExpired ? 'expired' : ''}">
                        ${company.expires_at ? company.expires_at : 'Onbeperkt'} ${isExpired ? '(Verlopen)' : ''}
                    </td>
                    <td>
                        <button class="btn btn-danger" style="padding: 6px 10px; font-size: 0.8rem;" onclick="deleteCompany('${company.id}')">Verwijderen</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // 4. Nieuw account toevoegen aan database
        document.getElementById('create-company-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const companyName = document.getElementById('company-name').value.trim();
            const companyCode = document.getElementById('company-code').value.trim().toLowerCase().replace(/\s+/g, '-');
            const accountType = document.getElementById('account-type').value;
            const password = document.getElementById('password').value.trim();
            const expiresAt = document.getElementById('expires-at').value;

            const { error } = await _supabase
                .from('companies')
                .insert([
                    { 
                        company_name: companyName, 
                        company_code: companyCode, 
                        account_type: accountType, 
                        password: password, 
                        expires_at: expiresAt 
                    }
                ]);

            if (error) {
                alert('Fout bij aanmaken: ' + error.message);
            } else {
                alert('Account succesvol aangemaakt!');
                document.getElementById('create-company-form').reset();
                document.getElementById('expires-at').valueAsDate = nextYear;
                loadCompanies();
            }
        });

        // 5. Account verwijderen
        window.deleteCompany = async function(id) {
            if (!confirm('Weet je zeker dat je dit account wilt verwijderen?')) return;

            const { error } = await _supabase
                .from('companies')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Fout bij verwijderen: ' + error.message);
            } else {
                loadCompanies();
            }
        }

        // Laad de lijst direct bij openen
        loadCompanies();
    </script>
</body>
</html>
