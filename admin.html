<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super-Admin | DJ Verzoekjes Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1, h2 {
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-active {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }

        .badge-warning {
            background-color: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .badge-expired {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        .btn-danger {
            background-color: var(--danger);
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ Super-Admin Dashboard</h1>
            <p id="admin-status" style="color: var(--text-muted);">Verbonden</p>
        </header>

        <div class="card">
            <h2>Nieuw Huurend Bedrijf Toevoegen</h2>
            <form id="tenant-form" style="margin-top: 16px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label for="company-name">Bedrijfsnaam / Naam DJ</label>
                        <input type="text" id="company-name" required placeholder="Bijv. DJ Tim Verhuur">
                    </div>
                    <div class="form-group">
                        <label for="company-slug">Unieke URL Slug (zonder spaties)</label>
                        <input type="text" id="company-slug" required placeholder="Bijv. dj-tim">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label for="primary-color">Primaire Huisstijl Kleur</label>
                        <input type="color" id="primary-color" value="#4f46e5" style="height: 45px; padding: 4px;">
                    </div>
                    <div class="form-group">
                        <label for="contact-email">Contact E-mailadres</label>
                        <input type="email" id="contact-email" placeholder="info@djtim.nl">
                    </div>
                </div>
                <div class="form-group">
                    <label for="subscription-months">Abonnementsduur</label>
                    <select id="subscription-months">
                        <option value="12">1 Jaar (Standaard)</option>
                        <option value="24">2 Jaar</option>
                        <option value="1">1 Maand (Test)</option>
                    </select>
                </div>
                <button type="submit">Bedrijf Toevoegen</button>
            </form>
        </div>

        <div class="card">
            <h2>Beheerde Bedrijven (Tenants)</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Bedrijfsnaam</th>
                            <th>Slug (Link)</th>
                            <th>Kleur</th>
                            <th>Abonnement tot</th>
                            <th>Status</th>
                            <th>Acties</th>
                        </tr>
                    </thead>
                    <tbody id="tenants-table-body">
                        <tr>
                            <td colspan="6" style="text-align: center; color: var(--text-muted);">Gegevens laden...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Supabase configuratie
        const SUPABASE_URL = 'JOUW_SUPABASE_PROJECT_URL';
        const SUPABASE_ANON_KEY = 'JOUW_SUPABASE_ANON_KEY';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadTenants() {
            const tbody = document.getElementById('tenants-table-body');
            try {
                const { data, error } = await _supabase.from('tenants').select('*').order('created_at', { ascending: false });
                
                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Nog geen bedrijven toegevoegd.</td></tr>`;
                    return;
                }

                const nu = new Date();

                tbody.innerHTML = data.map(tenant => {
                    const expiresAt = tenant.expires_at ? new Date(tenant.expires_at) : null;
                    let statusBadge = `<span class="badge badge-active">Actief</span>`;
                    
                    if (expiresAt) {
                        const diffTime = expiresAt - nu;
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                        if (diffDays < 0) {
                            statusBadge = `<span class="badge badge-expired">Verlopen</span>`;
                        } else if (diffDays <= 30) {
                            statusBadge = `<span class="badge badge-warning" title="Verloopt over ${diffDays} dagen!">⚠️ Verloopt bijna</span>`;
                        }
                    }

                    const formattedDate = expiresAt ? expiresAt.toLocaleDateString('nl-NL') : 'Onbeperkt';

                    return `
                        <tr>
                            <td><strong>${tenant.company_name}</strong></td>
                            <td><code>?tenant=${tenant.slug}</code></td>
                            <td><span style="display:inline-block;width:20px;height:20px;background:${tenant.primary_color};border-radius:4px;vertical-align:middle;"></span> ${tenant.primary_color}</td>
                            <td>${formattedDate}</td>
                            <td>${statusBadge}</td>
                            <td class="actions-cell">
                                <button class="btn-danger" onclick="deleteTenant('${tenant.id}')" style="padding: 6px 12px; font-size: 0.85rem;">Verwijderen</button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error('Fout bij ophalen tenants:', err);
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--danger);">Fout bij laden van gegevens.</td></tr>`;
            }
        }

        document.getElementById('tenant-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const company_name = document.getElementById('company-name').value;
            const slug = document.getElementById('company-slug').value.trim().toLowerCase().replace(/\s+/g, '-');
            const primary_color = document.getElementById('primary-color').value;
            const email = document.getElementById('contact-email').value;
            const months = parseInt(document.getElementById('subscription-months').value);

            // Bereken de vervaldatum op basis van gekozen maanden
            const expiresAt = new Date();
            expiresAt.setMonth(expiresAt.getMonth() + months);

            try {
                const { error } = await _supabase.from('tenants').insert([{ 
                    company_name, 
                    slug, 
                    primary_color, 
                    email, 
                    expires_at: expiresAt.toISOString() 
                }]);
                
                if (error) throw error;

                alert('Bedrijf succesvol toegevoegd met abonnement!');
                document.getElementById('tenant-form').reset();
                loadTenants();
            } catch (err) {
                alert('Fout bij toevoegen: ' + err.message);
            }
        });

        async function deleteTenant(id) {
            if (!confirm('Weet je zeker dat je dit bedrijf wilt verwijderen?')) return;
            
            try {
                const { error } = await _supabase.from('tenants').delete().eq('id', id);
                if (error) throw error;
                loadTenants();
            } catch (err) {
                alert('Fout bij verwijderen: ' + err.message);
            }
        }

        // Init laden bij openen pagina
        loadTenants();
    </script>
</body>
</html>
