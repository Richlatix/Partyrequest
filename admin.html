<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partyrequest - Superadmin</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    .card { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .btn { background-color: #FF4081; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    input, select { margin: 5px 0; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; display: block; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1>Admin Dashboard</h1>
    <button class="btn" style="background-color:#e53935;" onclick="handleLogout()">Uitloggen</button>
  </div>

  <div class="card">
    <h2>Nieuw Account Aanmaken</h2>
    <label>Type Account:</label>
    <select id="roleSelect">
      <option value="company">Bedrijf</option>
      <option value="solo_dj">Solo DJ</option>
    </select>
    <input type="text" id="accName" placeholder="Naam Bedrijf of Solo DJ">
    <input type="email" id="accEmail" placeholder="E-mailadres">
    <input type="password" id="accPassword" placeholder="Wachtwoord">
    <button class="btn" onclick="createAccount()">Account Aanmaken</button>
  </div>

  <div class="card">
    <h2>Bestaande Accounts</h2>
    <div id="accountsList">Laden...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const auth = await checkAuthSession(['admin']);
      if (!auth) return;
      loadAccounts();
    });

    async function createAccount() {
      const role = document.getElementById('roleSelect').value;
      const name = document.getElementById('accName').value;
      const email = document.getElementById('accEmail').value;
      const password = document.getElementById('accPassword').value;

      if (!name || !email || !password) return alert('Vul alle velden in.');

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) return alert('Fout: ' + error.message);

      await supabase.from('profiles').insert({
        id: data.user.id,
        name: name,
        role: role
      });

      // Als het een Solo DJ is, koppel een DJ record
      if (role === 'solo_dj') {
        await supabase.from('djs').insert({ user_id: data.user.id });
      }

      alert('Account succesvol aangemaakt!');
      loadAccounts();
    }

    async function loadAccounts() {
      const { data } = await supabase.from('profiles').select('*');
      const container = document.getElementById('accountsList');
      if (!data) return;
      container.innerHTML = data.map(a => `
        <div style="border-bottom: 1px solid #333; padding: 10px 0;">
          <strong>${a.name}</strong> - Type: <em>${a.role}</em>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
