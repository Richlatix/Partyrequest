<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super-Admin | DJ Verzoekjes Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1, h2 {
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
        }

        .badge-active {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }

        .badge-warning {
            background-color: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .badge-expired {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .badge-type {
            background-color: rgba(79, 70, 229, 0.2);
            color: #818cf8;
        }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        .btn-danger {
            background-color: var(--danger);
            padding: 6px 12px;
            font-size: 0.85rem;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ Super-Admin Dashboard</h1>
            <p id="admin-status" style="color: var(--text-muted);">Verbonden met Supabase</p>
        </header>

        <!-- Formulier om toe te voegen -->
        <div class="card">
            <h2>Nieuw Bedrijf / Solo DJ Toevoegen</h2>
            <form id="company-form" style="margin-top: 16px;">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="company-name">Bedrijfsnaam / DJ Naam</label>
                        <input type="text" id="company-name" required placeholder="Bijv. DJ Tim">
                    </div>
                    <div class="form-group">
                        <label for="company-code">Unieke Company Code (Slug)</label>
                        <input type="text" id="company-code" required placeholder="Bijv. dj-tim">
                    </div>
                    <div class="form-group">
                        <label for="account-type">Type Account</label>
                        <select id="account-type">
                            <option value="solo_dj">Solo DJ</option>
                            <option value="bedrijf">Bedrijf</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="subscription-months">Abonnementsduur</label>
                        <select id="subscription-months">
                            <option value="12">1 Jaar (Standaard)</option>
                            <option value="24">2 Jaar</option>
                            <option value="1">1 Maand (Test)</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="email">E-mailadres</label>
                        <input type="email" id="email" placeholder="info@djtim.nl">
                    </div>
                    <div class="form-group">
                        <label for="whatsapp-nr">WhatsApp Nummer</label>
                        <input type="text" id="whatsapp-nr" placeholder="31612345678">
                    </div>
                    <div class="form-group">
                        <label for="password">Wachtwoord</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="accent-color">Accent Kleur</label>
                        <input type="color" id="accent-color" value="#4f46e5" style="height: 42px; padding: 4px;">
                    </div>
                </div>

                <div class="form-group">
                    <label for="logo-url">Logo URL</label>
                    <input type="url" id="logo-url" placeholder="https://voorbeeld.nl/logo.png">
                </div>

                <button type="submit">Account Aanmaken</button>
            </form>
        </div>

        <!-- Overzichtstabel -->
        <div class="card">
            <h2>Beheerde Accounts (`companies`)</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Naam / Code</th>
                            <th>Type</th>
                            <th>Contact</th>
                            <th>Kleur</th>
                            <th>Abonnement tot</th>
                            <th>Status</th>
                            <th>Acties</th>
                        </tr>
                    </thead>
                    <tbody id="companies-table-body">
                        <tr>
                            <td colspan="7" style="text-align: center; color: var(--text-muted);">Gegevens laden...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Supabase configuratie (Vervang deze met jouw gegevens)
        const SUPABASE_URL = 'JOUW_SUPABASE_PROJECT_URL';
        const SUPABASE_ANON_KEY = 'JOUW_SUPABASE_ANON_KEY';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadCompanies() {
            const tbody = document.getElementById('companies-table-body');
            try {
                const { data, error } = await _supabase.from('companies').select('*').order('created_at', { ascending: false });
                
                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Nog geen accounts toegevoegd.</td></tr>`;
                    return;
                }

                const nu = new Date();

                tbody.innerHTML = data.map(company => {
                    const expiresAt = company.expires_at ? new Date(company.expires_at) : null;
                    let statusBadge = `<span class="badge badge-active">Actief</span>`;
                    
                    if (expiresAt) {
                        const diffTime = expiresAt - nu;
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                        if (diffDays < 0) {
                            statusBadge = `<span class="badge badge-expired">Verlopen</span>`;
                        } else if (diffDays <= 30) {
                            statusBadge = `<span class="badge badge-warning" title="Verloopt over ${diffDays} dagen!">⚠️ Verloopt bijna</span>`;
                        }
                    }

                    const formattedDate = expiresAt ? expiresAt.toLocaleDateString('nl-NL') : 'Onbeperkt';
                    const typeLabel = company.account_type === 'bedrijf' ? 'Bedrijf' : 'Solo DJ';

                    return `
                        <tr>
                            <td>
                                <strong>${company.company_name}</strong><br>
                                <code style="color: var(--text-muted); font-size: 0.85rem;">?company=${company.company_code}</code>
                            </td>
                            <td><span class="badge badge-type">${typeLabel}</span></td>
                            <td>
                                ${company.email || '-'}<br>
                                <span style="font-size: 0.85rem; color: var(--text-muted);">WA: ${company.whatsapp_nr || '-'}</span>
                            </td>
                            <td>
                                <span style="display:inline-block;width:18px;height:18px;background:${company.accent_color || '#fff'};border-radius:4px;vertical-align:middle;"></span> 
                                <span style="font-size:0.85rem;">${company.accent_color || '-'}</span>
                            </td>
                            <td>${formattedDate}</td>
                            <td>${statusBadge}</td>
                            <td class="actions-cell">
                                <button class="btn-danger" onclick="deleteCompany('${company.id}')">Verwijderen</button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error('Fout bij ophalen companies:', err);
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--danger);">Fout bij laden van gegevens.</td></tr>`;
            }
        }

        document.getElementById('company-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const company_name = document.getElementById('company-name').value;
            const company_code = document.getElementById('company-code').value.trim().toLowerCase().replace(/\s+/g, '-');
            const account_type = document.getElementById('account-type').value;
            const months = parseInt(document.getElementById('subscription-months').value);
            const email = document.getElementById('email').value;
            const whatsapp_nr = document.getElementById('whatsapp-nr').value;
            const password = document.getElementById('password').value;
            const accent_color = document.getElementById('accent-color').value;
            const logo_url = document.getElementById('logo-url').value;

            // Bereken de vervaldatum op basis van gekozen maanden
            const expiresAt = new Date();
            expiresAt.setMonth(expiresAt.getMonth() + months);

            try {
                const { error } = await _supabase.from('companies').insert([{ 
                    company_name, 
                    company_code, 
                    account_type,
                    email, 
                    whatsapp_nr, 
                    password, 
                    accent_color, 
                    logo_url,
                    expires_at: expiresAt.toISOString() 
                }]);
                
                if (error) throw error;

                alert('Account succesvol aangemaakt!');
                document.getElementById('company-form').reset();
                loadCompanies();
            } catch (err) {
                alert('Fout bij toevoegen: ' + err.message);
            }
        });

        async function deleteCompany(id) {
            if (!confirm('Weet je zeker dat je dit account wilt verwijderen?')) return;
            
            try {
                const { error } = await _supabase.from('companies').delete().eq('id', id);
                if (error) throw error;
                loadCompanies();
            } catch (err) {
                alert('Fout bij verwijderen: ' + err.message);
            }
        }

        // Automatisch laden bij openen pagina
        loadCompanies();
    </script>
</body>
</html>
