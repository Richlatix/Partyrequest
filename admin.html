<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super-Admin Dashboard | DJ Verzoekjes Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        h1, h2, h3 {
            margin: 0;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #16a34a; }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-warning { background-color: var(--warning); color: #000; }
        .btn-outline { background: none; border: 1px solid var(--border); color: var(--text-muted); }
        .btn-outline:hover { border-color: var(--primary); color: var(--text); background-color: rgba(79, 70, 229, 0.1); }
        .btn-active { background-color: var(--warning) !important; color: #000 !important; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .alert-box {
            background-color: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--warning);
            color: var(--warning);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, select {
            padding: 10px 12px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }
        th { color: var(--text-muted); font-weight: 600; }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            display: inline-block;
        }
        .badge-bedrijf { background-color: rgba(79, 70, 229, 0.2); color: #818cf8; }
        .badge-dj { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-warning { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }

        /* Uitklapbaar gedeelte */
        .toggle-row { cursor: pointer; transition: background 0.2s; }
        .toggle-row:hover { background-color: rgba(255, 255, 255, 0.02); }
        .details-row { background-color: rgba(15, 23, 42, 0.6); display: none; }
        .details-row.open { display: table-row; }
        .details-content { padding: 20px; }
        
        .sub-table {
            width: 100%;
            margin-top: 10px;
            background-color: var(--card-bg);
            border-radius: 8px;
        }
        .sub-table th, .sub-table td { padding: 8px 12px; font-size: 0.85rem; }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            align-items: flex-end;
        }

        .dashboard-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ Super-Admin Dashboard</h1>
            <button id="logout-btn" class="btn btn-outline">Uitloggen</button>
        </header>

        <!-- Meldingen voor bijna aflopende abonnementen -->
        <div id="expiration-alert-container"></div>

        <!-- Formulier: Nieuw Bedrijf of DJ Toevoegen -->
        <div class="card">
            <h2>Nieuw Account Aanmaken</h2>
            <form id="create-company-form" style="margin-top: 16px;">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="company-name">Bedrijfs- of DJ Naam</label>
                        <input type="text" id="company-name" required placeholder="Bijv. DJ Tim of Club Lux">
                    </div>
                    <div class="form-group">
                        <label for="company-code">Unieke Code / Slug</label>
                        <input type="text" id="company-code" required placeholder="Bijv. dj-tim">
                    </div>
                    <div class="form-group">
                        <label for="account-type">Type Account</label>
                        <select id="account-type">
                            <option value="dj">Solo DJ</option>
                            <option value="bedrijf">Bedrijf</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="password">Wachtwoord</label>
                        <input type="text" id="password" required placeholder="Wachtwoord">
                    </div>
                    <div class="form-group">
                        <label for="expires-at">Abonnement Geldig Tot</label>
                        <input type="date" id="expires-at" required>
                    </div>
                </div>
                <button type="submit" class="btn">Account Aanmaken</button>
            </form>
        </div>

        <!-- Overzicht van alle bestaande accounts -->
        <div class="card">
            <div class="dashboard-actions">
                <div>
                    <h2>Beheerde Accounts</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Klik op een rij om details te openen en instellingen te wijzigen.</p>
                </div>
                <div>
                    <button id="filter-expiring-btn" class="btn btn-outline" onclick="toggleExpiringFilter()">⏳ Bijna verlopen (Binnen 30 dagen)</button>
                </div>
            </div>
            
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Naam</th>
                            <th>Code (Slug)</th>
                            <th>Type</th>
                            <th>Hoofdwachtwoord</th>
                            <th>Verloopt op</th>
                            <th>Acties</th>
                        </tr>
                    </thead>
                    <tbody id="companies-table-body">
                        <tr>
                            <td colspan="6" style="text-align: center; color: var(--text-muted);">Gegevens laden...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('super_admin_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            sessionStorage.removeItem('super_admin_logged_in');
            window.location.href = 'login.html';
        });

        const SUPABASE_URL = 'https://yhitywueffetjjnoudkt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_UVo2rR8P1p3eH6Un0Mn1rw_4AnBv1po';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allCompaniesData = [];
        let showOnlyExpiring = false;

        const nextYear = new Date();
        nextYear.setFullYear(nextYear.getFullYear() + 1);
        document.getElementById('expires-at').valueAsDate = nextYear;

        async function loadCompanies() {
            const tableBody = document.getElementById('companies-table-body');
            const alertContainer = document.getElementById('expiration-alert-container');
            
            const { data, error } = await _supabase
                .from('companies')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--danger);">Fout bij laden: ${error.message}</td></tr>`;
                return;
            }

            allCompaniesData = data || [];

            if (allCompaniesData.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Nog geen accounts aangemaakt.</td></tr>`;
                alertContainer.innerHTML = '';
                return;
            }

            const now = new Date();
            const in30Days = new Date();
            in30Days.setDate(now.getDate() + 30);

            const expiringSoon = allCompaniesData.filter(c => {
                if (c.expires_at) {
                    const expDate = new Date(c.expires_at);
                    return expDate >= now && expDate <= in30Days;
                }
                return false;
            });

            if (expiringSoon.length > 0) {
                const names = expiringSoon.map(c => `<strong>${c.company_name}</strong> (${c.expires_at})`).join(', ');
                alertContainer.innerHTML = `<div class="alert-box">⚠️ Volgende abonnement(en) verlopen binnen 30 dagen: ${names}</div>`;
            } else {
                alertContainer.innerHTML = '';
            }

            renderTable();
        }

        window.toggleExpiringFilter = function() {
            showOnlyExpiring = !showOnlyExpiring;
            const btn = document.getElementById('filter-expiring-btn');
            if (showOnlyExpiring) {
                btn.classList.add('btn-active');
                btn.classList.remove('btn-outline');
            } else {
                btn.classList.remove('btn-active');
                btn.classList.add('btn-outline');
            }
            renderTable();
        }

        function renderTable() {
            const tableBody = document.getElementById('companies-table-body');
            const now = new Date();
            const in30Days = new Date();
            in30Days.setDate(now.getDate() + 30);

            let dataToDisplay = allCompaniesData;

            if (showOnlyExpiring) {
                dataToDisplay = allCompaniesData.filter(c => {
                    if (c.expires_at) {
                        const expDate = new Date(c.expires_at);
                        return expDate >= now && expDate <= in30Days;
                    }
                    return false;
                });
            }

            if (dataToDisplay.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Geen accounts gevonden die aan dit filter voldoen.</td></tr>`;
                return;
            }

            tableBody.innerHTML = '';

            for (const company of dataToDisplay) {
                const isExpired = company.expires_at && new Date() > new Date(company.expires_at);
                const isExpiringSoon = company.expires_at && new Date() >= new Date() && new Date(company.expires_at) <= in30Days;
                const badgeClass = company.account_type === 'bedrijf' ? 'badge-bedrijf' : 'badge-dj';
                
                let statusBadge = '';
                if (isExpired) statusBadge = `<span class="badge badge-danger">Verlopen</span>`;
                else if (isExpiringSoon) statusBadge = `<span class="badge badge-warning">Verloopt bijna</span>`;

                // Hoofdrij
                const row = document.createElement('tr');
                row.className = 'toggle-row';
                row.title = 'Klik om details te openen';
                row.onclick = (e) => {
                    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
                    toggleDetails(company.id);
                };

                row.innerHTML = `
                    <td><strong>${company.company_name}</strong> 🔽</td>
                    <td><code>${company.company_code}</code></td>
                    <td><span class="badge ${badgeClass}">${company.account_type}</span></td>
                    <td><code>${company.password}</code></td>
                    <td>
                        ${company.expires_at ? company.expires_at : 'Onbeperkt'} 
                        ${statusBadge}
                    </td>
                    <td>
                        <button class="btn btn-danger" style="padding: 6px 10px; font-size: 0.8rem;" onclick="deleteCompany('${company.id}')">Verwijderen</button>
                    </td>
                `;
                tableBody.appendChild(row);

                // Uitklapbare details rij met duidelijke Opslaan knop
                const detailsRow = document.createElement('tr');
                detailsRow.id = `details-${company.id}`;
                detailsRow.className = 'details-row';

                let extraContent = '';
                if (company.account_type === 'bedrijf') {
                    extraContent = `
                        <h4 style="margin: 20px 0 8px 0;">Gekoppelde DJ's / Gebruikers</h4>
                        <div id="djs-list-${company.id}">Laden...</div>
                        
                        <form onsubmit="addCompanyDJ(event, '${company.id}')" style="margin-top: 15px; display: flex; gap: 10px; align-items: flex-end;">
                            <div class="form-group" style="margin:0;">
                                <label>DJ Naam</label>
                                <input type="text" id="dj-name-${company.id}" required placeholder="DJ Naam">
                            </div>
                            <div class="form-group" style="margin:0;">
                                <label>Wachtwoord</label>
                                <input type="text" id="dj-pass-${company.id}" required placeholder="Wachtwoord">
                            </div>
                            <button type="submit" class="btn" style="padding: 10px 14px;">DJ Toevoegen</button>
                        </form>
                    `;
                }

                detailsRow.innerHTML = `
                    <td colspan="6">
                        <div class="details-content">
                            <h3>Instellingen voor ${company.company_name}</h3>
                            <div class="settings-grid" style="margin-top: 12px;">
                                <div class="form-group" style="margin:0;">
                                    <label>Hoofdwachtwoord</label>
                                    <input type="text" id="pass-input-${company.id}" value="${company.password}">
                                </div>
                                <div class="form-group" style="margin:0;">
                                    <label>Abonnement Geldig Tot</label>
                                    <input type="date" id="date-input-${company.id}" value="${company.expires_at || ''}">
                                </div>
                                <div>
                                    <button type="button" class="btn btn-success" onclick="saveCompanySettings('${company.id}')">Wijzigingen Opslaan</button>
                                </div>
                            </div>
                            ${extraContent}
                        </div>
                    </td>
                `;
                tableBody.appendChild(detailsRow);

                if (company.account_type === 'bedrijf') {
                    loadCompanyDJs(company.id);
                }
            }
        }

        window.toggleDetails = function(companyId) {
            const detailsRow = document.getElementById(`details-${companyId}`);
            detailsRow.classList.toggle('open');
        }

        // Functie om hoofdwachtwoord en vervaldatum handmatig op te slaan
        window.saveCompanySettings = async function(id) {
            const newPassword = document.getElementById(`pass-input-${id}`).value.trim();
            const newDate = document.getElementById(`date-input-${id}`).value;

            if (!newPassword) {
                alert('Wachtwoord mag niet leeg zijn.');
                return;
            }

            const { error } = await _supabase
                .from('companies')
                .update({ 
                    password: newPassword, 
                    expires_at: newDate === '' ? null : newDate 
                })
                .eq('id', id);

            if (error) {
                alert('Fout bij opslaan: ' + error.message);
            } else {
                alert('Instellingen succesvol opgeslagen!');
                loadCompanies();
            }
        }

        async function loadCompanyDJs(companyId) {
            const container = document.getElementById(`djs-list-${companyId}`);
            const { data, error } = await _supabase
                .from('company_djs')
                .select('*')
                .eq('company_id', companyId);

            if (error || !data || data.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); font-size: 0.85rem;">Nog geen extra DJ's toegevoegd aan dit bedrijf.</p>`;
                return;
            }

            let html = `
                <table class="sub-table">
                    <thead><tr><th>DJ Naam</th><th>Wachtwoord</th><th>Actie</th></tr></thead>
                    <tbody>
            `;
            data.forEach(dj => {
                html += `
                    <tr>
                        <td>${dj.dj_name}</td>
                        <td>
                            <input type="text" value="${dj.password}" style="padding: 4px 8px; width: 120px;" onchange="updateDJField('${dj.id}', '${companyId}', this.value)">
                        </td>
                        <td><button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="deleteCompanyDJ('${dj.id}', '${companyId}')">Verwijderen</button></td>
                    </tr>
                `;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        window.addCompanyDJ = async function(e, companyId) {
            e.preventDefault();
            const djName = document.getElementById(`dj-name-${companyId}`).value.trim();
            const djPass = document.getElementById(`dj-pass-${companyId}`).value.trim();

            const { error } = await _supabase.from('company_djs').insert([
                { company_id: companyId, dj_name: djName, password: djPass }
            ]);

            if (error) {
                alert('Fout bij toevoegen DJ: ' + error.message);
            } else {
                document.getElementById(`dj-name-${companyId}`).value = '';
                document.getElementById(`dj-pass-${companyId}`).value = '';
                loadCompanyDJs(companyId);
            }
        }

        window.deleteCompanyDJ = async function(djId, companyId) {
            if (!confirm('Weet je zeker dat je deze DJ wilt verwijderen?')) return;
            const { error } = await _supabase.from('company_djs').delete().eq('id', djId);
            if (error) alert('Fout bij verwijderen: ' + error.message);
            else loadCompanyDJs(companyId);
        }

        window.updateDJField = async function(djId, companyId, newPassword) {
            const { error } = await _supabase
                .from('company_djs')
                .update({ password: newPassword })
                .eq('id', djId);

            if (error) {
                alert('Fout bij bijwerken DJ wachtwoord: ' + error.message);
                loadCompanyDJs(companyId);
            }
        }

        document.getElementById('create-company-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const companyName = document.getElementById('company-name').value.trim();
            const companyCode = document.getElementById('company-code').value.trim().toLowerCase().replace(/\s+/g, '-');
            const accountType = document.getElementById('account-type').value;
            const password = document.getElementById('password').value.trim();
            const expiresAt = document.getElementById('expires-at').value;

            const { data: newCompany, error } = await _supabase
                .from('companies')
                .insert([
                    { 
                        company_name: companyName, 
                        company_code: companyCode, 
                        account_type: accountType, 
                        password: password, 
                        expires_at: expiresAt 
                    }
                ])
                .select()
                .single();

            if (error) {
                alert('Fout bij aanmaken: ' + error.message);
                return;
            }

            if (accountType === 'dj' && newCompany) {
                await _supabase
                    .from('company_djs')
                    .insert([
                        {
                            company_id: newCompany.id,
                            dj_name: companyName,
                            password: password
                        }
                    ]);
            }

            alert('Account succesvol aangemaakt!');
            document.getElementById('create-company-form').reset();
            document.getElementById('expires-at').valueAsDate = nextYear;
            loadCompanies();
        });

        window.deleteCompany = async function(id) {
            if (!confirm('Weet je zeker dat je dit account wilt verwijderen? Alle gekoppelde gegevens worden ook verwijderd.')) return;

            const { error } = await _supabase
                .from('companies')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Fout bij verwijderen: ' + error.message);
            } else {
                loadCompanies();
            }
        }

        loadCompanies();
    </script>
</body>
</html>
