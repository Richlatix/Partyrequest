<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super-Admin | DJ Verzoekjes Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1, h2 {
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
            vertical-align: middle;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-block;
        }

        .badge-active { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
        .badge-warning { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-expired { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .actions-cell {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #16a34a; }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ Super-Admin Dashboard</h1>
            <p id="admin-status" style="color: var(--text-muted);">Abonnementen Beheer</p>
        </header>

        <div class="card">
            <h2>Nieuw Huurend Bedrijf Toevoegen</h2>
            <form id="tenant-form" style="margin-top: 16px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label for="company-name">Bedrijfsnaam / Naam DJ</label>
                        <input type="text" id="company-name" required placeholder="Bijv. DJ Tim Verhuur">
                    </div>
                    <div class="form-group">
                        <label for="company-slug">Unieke URL Slug (zonder spaties)</label>
                        <input type="text" id="company-slug" required placeholder="Bijv. dj-tim">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label for="primary-color">Primaire Huisstijl Kleur</label>
                        <input type="color" id="primary-color" value="#4f46e5" style="height: 45px; padding: 4px;">
                    </div>
                    <div class="form-group">
                        <label for="contact-email">Contact E-mailadres</label>
                        <input type="email" id="contact-email" placeholder="info@djtim.nl">
                    </div>
                    <div class="form-group">
                        <label for="subscription-period">Abonnementstermijn</label>
                        <select id="subscription-period">
                            <option value="1">1 Jaar (Standaard)</option>
                            <option value="2">2 Jaar</option>
                            <option value="0.083">1 Maand (Test)</option>
                        </select>
                    </div>
                </div>
                <button type="submit">Bedrijf Toevoegen</button>
            </form>
        </div>

        <div class="card">
            <h2>Beheerde Bedrijven (Tenants)</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">
                Bedrijven waarvan het abonnement is verlopen, worden automatisch gesignaleerd. Je ziet hier direct wie vernieuwd moet worden.
            </p>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Bedrijfsnaam</th>
                            <th>Slug (Link)</th>
                            <th>Kleur</th>
                            <th>Vervaldatum</th>
                            <th>Status</th>
                            <th>Acties</th>
                        </tr>
                    </thead>
                    <tbody id="tenants-
