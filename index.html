<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muziek Verzoekjes | Feest</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #7dff00;
      --border-color: #2a2a2a;
      --subtext-color: #b0b0b0;
    }

    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: var(--bg-color); 
      color: var(--text-color); 
      padding: 20px; 
      max-width: 650px; 
      margin: auto; 
    }

    h1, h2, h3 { color: var(--accent-color); text-align: center; }
    
    input, button, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--border-color); box-sizing: border-box; font-family: inherit; background: var(--card-bg); color: var(--text-color); }
    button { background: var(--accent-color); color: #121212; font-weight: bold; cursor: pointer; border: none; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    
    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); }
    .hidden { display: none !important; }
    
    .request-item { background: #252525; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--accent-color); }
    .request-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .request-info { flex: 1; }
    
    .action-btn { padding: 6px 12px; border-radius: 6px; font-size: 0.85em; font-weight: bold; cursor: pointer; border: none; background: #2a2a2a; color: var(--text-color); display: flex; align-items: center; gap: 5px; }
    .like-btn { background: #2a2a2a; color: #ff4444; border: 1px solid #ff4444; }
    .like-btn.liked { background: #ff4444; color: #fff; }

    .toast-popup {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e1e;
      color: #ffffff;
      border: 1.5px solid var(--accent-color);
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
      z-index: 9999;
      font-weight: bold;
      text-align: center;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    
    .library-result-item { background: #252525; padding: 10px; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; }
    
    .comments-section { margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 8px; font-size: 0.85em; }
    .comment-item { background: #181818; padding: 6px 10px; border-radius: 6px; margin-top: 4px; color: var(--subtext-color); }
  </style>
</head>
<body>

  <!-- INLOGSCHERM FEESTCODE -->
  <div id="login-view" style="max-width: 400px; margin: 60px auto; text-align: center;">
    <h2>🎉 Vraag een nummer aan!</h2>
    <p style="color:var(--subtext-color); font-size: 0.9em;">Voer de feestcode van de DJ in:</p>
    <input type="text" id="party-code-input" placeholder="Bijv. 015512" style="text-align:center; font-size: 1.5em; letter-spacing: 2px;">
    <button onclick="loginGuest()">Naar het feest! 🚀</button>
  </div>

  <!-- HOOFDSCHERM GAST -->
  <div id="guest-dashboard" class="hidden">
    
    <div class="top-bar">
      <div>
        <h2 id="party-title" style="margin:0; text-align:left;">Feest Verzoekjes</h2>
        <p style="color:var(--subtext-color); margin:0; font-size:0.85em;">DJ: <span id="dj-name-display" style="color:var(--accent-color); font-weight: bold;"></span></p>
      </div>
      <button onclick="logoutGuest()" style="background: transparent; color: var(--subtext-color); border: none; width: auto; font-size: 0.85em; cursor: pointer; text-decoration: underline;">Ander feest</button>
    </div>

    <!-- WELKOMSTTEKST VAN DJ -->
    <div class="card" id="welcome-card" style="background: rgba(125, 255, 0, 0.05); border-left: 4px solid var(--accent-color);">
      <p id="welcome-text-display" style="margin: 0; font-size: 0.95em; color: var(--text-color);"></p>
    </div>

    <!-- ZOEKEN IN BIBLIOTHEEK -->
    <div class="card">
      <h3 style="margin-top:0; text-align:left; color:var(--accent-color); font-size:1.1em;">🔍 Zoek in Muziekbibliotheek</h3>
      <input type="text" id="library-search-input" placeholder="Typ artiest of titel..." oninput="searchLibrary()" style="margin-bottom: 8px;">
      
      <div id="library-results" style="max-height: 200px; overflow-y: auto; margin-bottom: 10px;">
        <p style="color:var(--subtext-color); font-size:0.85em; text-align:center;">Typ hierboven om te zoeken in de bibliotheek van de DJ...</p>
      </div>

      <!-- KNOP VOOR HANDMATIG INVOEREN -->
      <button onclick="toggleManualInput()" id="toggle-manual-btn" style="background: #2a2a2a; color: var(--accent-color); border: 1px dashed var(--accent-color); font-size: 0.85em; padding: 10px; margin-top: 5px;">
        Staat het nummer niet in de bibliotheek? Klik dan hier ✍️
      </button>

      <!-- HANDMATIG VERZOEKJE FORMULIER (STANDAARD VERBORGEN) -->
      <div id="manual-form-container" class="hidden" style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
        <input type="text" id="manual-song" placeholder="Nummer (titel)" style="font-size: 0.9em; margin-bottom: 6px;">
        <input type="text" id="manual-artist" placeholder="Artiest" style="font-size: 0.9em; margin-bottom: 6px;">
        <input type="text" id="manual-message" placeholder="Persoonlijk berichtje voor de DJ (optioneel)" style="font-size: 0.9em; margin-bottom: 10px;">
        <button onclick="submitManualRequest()" style="padding: 10px; font-size: 0.9em;">Handmatig Versturen 🎶</button>
      </div>
    </div>

    <!-- LIJST VAN ALLE VERZOEKJES & STEMMEN -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="margin:0; text-align:left; color:var(--accent-color); font-size:1.1em;">📋 Ingediende Verzoekjes</h3>
      </div>
      <div id="guest-requests-list">
        <p style="color:var(--subtext-color); font-size:0.85em;">Nog geen verzoekjes...</p>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://yhitywueffetjjnoudkt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UVo2rR8P1p3eH6Un0Mn1rw_4AnBv1po";

    let dbClient = null;
    let currentDjId = null;
    let currentPartyCode = null;
    let xmlLibraryTracks = [];
    let realtimeSubscription = null;
    let presenceChannel = null;

    function toonPopup(bericht) {
      const oudePopup = document.getElementById('custom-toast');
      if (oudePopup) oudePopup.remove();

      const popup = document.createElement('div');
      popup.id = 'custom-toast';
      popup.className = 'toast-popup';
      popup.innerText = bericht;

      document.body.appendChild(popup);
      setTimeout(() => { if (popup) popup.remove(); }, 3000);
    }

    function initSupabase() {
      if (!dbClient) {
        dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    }

    window.onload = function() {
      initSupabase();
      const savedPartyCode = localStorage.getItem('active_party_code');
      if (savedPartyCode) {
        document.getElementById('party-code-input').value = savedPartyCode;
        loginGuest(true);
      }
    };

    async function loginGuest(isAutoLogin = false) {
      const partyCodeInput = document.getElementById('party-code-input').value.trim();
      if (!partyCodeInput || partyCodeInput.length < 5) {
        if (!isAutoLogin) toonPopup('Voer een geldige feestcode in!');
        return;
      }

      initSupabase();

      const djCode = partyCodeInput.substring(0, 4);

      const { data: djData, error: djError } = await dbClient
        .from('djs')
        .select('*, companies(*)')
        .eq('dj_code', djCode)
        .single();

      if (djError || !djData) {
        if (!isAutoLogin) toonPopup('Feestcode niet gevonden. Controleer de code.');
        localStorage.removeItem('active_party_code');
        return;
      }

      currentDjId = djData.id;
      currentPartyCode = partyCodeInput;
      localStorage.setItem('active_party_code', partyCodeInput);

      if (djData.companies && djData.companies.accent_color) {
        document.documentElement.style.setProperty('--accent-color', djData.companies.accent_color);
      }

      document.getElementById('dj-name-display').innerText = djData.dj_name;
      
      const welcomeBox = document.getElementById('welcome-card');
      if (djData.welcome_text) {
        document.getElementById('welcome-text-display').innerText = djData.welcome_text;
        welcomeBox.classList.remove('hidden');
      } else {
        welcomeBox.classList.add('hidden');
      }

      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('guest-dashboard').classList.remove('hidden');

      loadXmlLibrary();
      loadGuestRequests();
      setupRealtimeListener();
      setupPresenceTracker(partyCodeInput);
    }

    function toggleManualInput() {
      const container = document.getElementById('manual-form-container');
      const btn = document.getElementById('toggle-manual-btn');
      
      if (container.classList.contains('hidden')) {
        container.classList.remove('hidden');
        btn.innerText = 'Sluit handmatig invoeren ▲';
      } else {
        container.classList.add('hidden');
        btn.innerText = 'Staat het nummer niet in de bibliotheek? Klik dan hier ✍️';
      }
    }

    function setupPresenceTracker(partyCode) {
      presenceChannel = dbClient.channel(`party_${partyCode}`, {
        config: { presence: { key: 'guest_' + Math.random() } }
      });
      presenceChannel.subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await presenceChannel.track({ online_at: new Date().toISOString(), role: 'guest' });
        }
      });
    }

    function logoutGuest() {
      localStorage.removeItem('active_party_code');
      if (realtimeSubscription) dbClient.removeChannel(realtimeSubscription);
      if (presenceChannel) dbClient.removeChannel(presenceChannel);
      document.getElementById('guest-dashboard').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
      document.getElementById('party-code-input').value = '';
    }

    async function loadXmlLibrary() {
      xmlLibraryTracks = [];
      const { data, error } = await dbClient.from('xml_files').select('file_content').eq('dj_id', currentDjId);
      
      if (error || !data) return;

      data.forEach(file => {
        try {
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(file.file_content, "text/xml");
          
          let tracks = xmlDoc.getElementsByTagName('TRACK');
          if (tracks.length === 0) tracks = xmlDoc.getElementsByTagName('track');
          if (tracks.length === 0) tracks = xmlDoc.getElementsByTagName('ENTRY');

          for (let i = 0; i < tracks.length; i++) {
            let title = tracks[i].getAttribute('Name') || tracks[i].getAttribute('TITLE') || 'Onbekend';
            let artist = tracks[i].getAttribute('Artist') || tracks[i].getAttribute('ARTIST') || 'Onbekende artiest';
            xmlLibraryTracks.push({ title, artist });
          }
        } catch (e) {
          console.error("Fout bij parsen XML:", e);
        }
      });
    }

    function searchLibrary() {
      const query = document.getElementById('library-search-input').value.toLowerCase().trim();
      const resultsContainer = document.getElementById('library-results');
      resultsContainer.innerHTML = '';

      if (query.length < 2) {
        resultsContainer.innerHTML = '<p style="color:var(--subtext-color); font-size:0.85em; text-align:center;">Typ minimaal 2 tekens om te zoeken...</p>';
        return;
      }

      const matches = xmlLibraryTracks.filter(t => 
        t.title.toLowerCase().includes(query) || t.artist.toLowerCase().includes(query)
      ).slice(0, 15);

      if (matches.length === 0) {
        resultsContainer.innerHTML = '<p style="color:var(--subtext-color); font-size:0.85em; text-align:center;">Geen nummers gevonden in de bibliotheek.</p>';
        return;
      }

      matches.forEach(track => {
        resultsContainer.innerHTML += `
          <div class="library-result-item">
            <span>🎵 <strong>${track.title}</strong> - <span style="color:var(--subtext-color);">${track.artist}</span></span>
            <button onclick="requestFromLibrary('${track.title.replace(/'/g, "\\'")}', '${track.artist.replace(/'/g, "\\'")}')" style="width: auto; padding: 6px 10px; font-size: 0.8em; margin:0;">Aanvragen</button>
          </div>`;
      });
    }

    async function requestFromLibrary(title, artist) {
      const { error } = await dbClient.from('requests').insert([{
        dj_id: currentDjId,
        song_title: title,
        artist: artist,
        sender_name: 'Anoniem',
        status: 'pending',
        likes: 0
      }]);

      if (error) {
        toonPopup('Fout bij aanvragen nummer.');
      } else {
        toonPopup('Verzoekje succesvol verzonden! 🎶');
        document.getElementById('library-search-input').value = '';
        document.getElementById('library-results').innerHTML = '<p style="color:var(--subtext-color); font-size:0.85em; text-align:center;">Nummer aangevraagd!</p>';
      }
    }

    async function submitManualRequest() {
      const song = document.getElementById('manual-song').value.trim();
      const artist = document.getElementById('manual-artist').value.trim();
      const message = document.getElementById('manual-message').value.trim();

      if (!song || !artist) return toonPopup('Vul minimaal de titel en artiest in!');

      const { error } = await dbClient.from('requests').insert([{
        dj_id: currentDjId,
        song_title: song,
        artist: artist,
        sender_name: 'Anoniem',
        message: message,
        status: 'pending',
        likes: 0
      }]);

      if (error) {
        toonPopup('Fout bij versturen verzoekje.');
      } else {
        toonPopup('Verzoekje verzonden naar de DJ! 🎉');
        document.getElementById('manual-song').value = '';
        document.getElementById('manual-artist').value = '';
        document.getElementById('manual-message').value = '';
        toggleManualInput();
      }
    }

    async function loadGuestRequests() {
      const { data, error } = await dbClient
        .from('requests')
        .select('*, comments(*)')
        .eq('dj_id', currentDjId)
        .eq('status', 'pending')
        .order('likes', { ascending: false })
        .order('created_at', { ascending: false });

      const listContainer = document.getElementById('guest-requests-list');
      listContainer.innerHTML = '';

      if (error || !data || data.length === 0) {
        listContainer.innerHTML = '<p style="color:var(--subtext-color); font-size:0.85em;">Nog geen actieve verzoekjes. Wees de eerste!</p>';
        return;
      }

      const myLikedRequests = JSON.parse(localStorage.getItem('liked_requests') || '[]');

      data.forEach(req => {
        const isLiked = myLikedRequests.includes(req.id);
        
        let commentsHtml = '';
        if (req.comments && req.comments.length > 0) {
          req.comments.forEach(c => {
            commentsHtml += `<div class="comment-item">💬 <strong>${c.author || 'Gast'}:</strong> ${c.text}</div>`;
          });
        }

        listContainer.innerHTML += `
          <div class="request-item">
            <div class="request-header">
              <div class="request-info">
                <strong>🎵 ${req.song_title}</strong> - <span style="color:var(--subtext-color);">${req.artist}</span><br>
                <small style="color:var(--subtext-color);">${req.message ? `"${req.message}"` : ''}</small>
              </div>
              <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${req.id}', ${isLiked})">
                ❤️ <span id="likes-count-${req.id}">${req.likes || 0}</span>
              </button>
            </div>
            
            <div class="comments-section">
              <div id="comments-list-${req.id}">
                ${commentsHtml}
              </div>
              <div style="display: flex; gap: 6px; margin-top: 6px;">
                <input type="text" id="comment-input-${req.id}" placeholder="Schrijf een reactie..." style="margin:0; padding: 6px; font-size: 0.8em;">
                <button onclick="addComment('${req.id}')" style="width: auto; margin:0; padding: 6px 12px; font-size: 0.8em;">Reageer</button>
              </div>
            </div>
          </div>`;
      });
    }

    async function toggleLike(requestId, isLiked) {
      let myLikedRequests = JSON.parse(localStorage.getItem('liked_requests') || '[]');
      
      const { data: reqData } = await dbClient.from('requests').select('likes').eq('id', requestId).single();
      if (!reqData) return;

      let newLikes = reqData.likes || 0;

      if (isLiked) {
        newLikes = Math.max(0, newLikes - 1);
        myLikedRequests = myLikedRequests.filter(id => id !== requestId);
      } else {
        newLikes += 1;
        myLikedRequests.push(requestId);
      }

      localStorage.setItem('liked_requests', JSON.stringify(myLikedRequests));

      await dbClient.from('requests').update({ likes: newLikes }).eq('id', requestId);
      loadGuestRequests();
    }

    async function addComment(requestId) {
      const inputEl = document.getElementById(`comment-input-${requestId}`);
      const text = inputEl.value.trim();
      if (!text) return;

      const { error } = await dbClient.from('comments').insert([{
        request_id: requestId,
        author: 'Gast',
        text: text
      }]);

      if (error) {
        toonPopup('Fout bij plaatsen reactie.');
      } else {
        inputEl.value = '';
        loadGuestRequests();
      }
    }

    function setupRealtimeListener() {
      if (!currentDjId) return;

      realtimeSubscription = dbClient
        .channel('public:guest_requests')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'requests', filter: `dj_id=eq.${currentDjId}` }, payload => {
          loadGuestRequests();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, payload => {
          loadGuestRequests();
        })
        .subscribe();
    }
  </script>
</body>
</html>
