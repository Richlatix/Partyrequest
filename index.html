<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partyrequest - Verzoekje Indienen</title>
    <script src="style.js"></script>
</head>
<body>
    <div class="container" style="max-width: 600px; padding-top: 40px;">
        
        <!-- STAP 1: Partycode Invoeren -->
        <div id="codeSection" class="card">
            <h2>Feest Verzoekjes</h2>
            <p>Voer de partycode in die je van de DJ hebt gekregen.</p>
            <input type="text" id="inputPartyCode" placeholder="Bijv. 123456" style="font-size: 20px; text-align: center; letter-spacing: 2px;">
            <button class="btn-primary" onclick="joinParty()">Verbinden</button>
        </div>

        <!-- STAP 2: Gasten Dashboard -->
        <div id="guestSection" style="display: none;">
            <div class="card" style="margin-bottom: 20px; text-align: center;">
                <h2 id="guestWelcomeTitle" style="color: var(--primary-color);">Welkom!</h2>
                <p id="guestWelcomeText" style="color: #ddd;"></p>
                <button onclick="leaveParty()" style="background: none; border: none; color: #888; text-decoration: underline; cursor: pointer; margin-top: 10px;">Ander feest kiezen</button>
            </div>

            <!-- Verzoekje Plaatsen -->
            <div class="card" style="margin-bottom: 20px;">
                <h3>Nummer Aanvragen</h3>
                <label>Zoek in library of vul handmatig in:</label>
                <input type="text" id="searchQuery" placeholder="Zoek op artiest of titel..." oninput="filterLibrary()">
                
                <div id="librarySearchResults" style="max-height: 150px; overflow-y: auto; margin-bottom: 10px;"></div>

                <div style="background: #0f0e17; padding: 10px; border-radius: 6px; margin-bottom: 15px;">
                    <p style="font-size: 12px; color: #aaa; margin-bottom: 3px;">Geselecteerd nummer:</p>
                    <b id="selectedTrackDisplay">Geen nummer geselecteerd (of handmatig hieronder)</b>
                </div>

                <input type="text" id="reqArtist" placeholder="Artiest">
                <input type="text" id="reqTitle" placeholder="Nummer Titel">
                <input type="text" id="reqMessage" placeholder="Persoonlijk berichtje (bijv. 'Speciaal voor Sanne')">
                
                <button class="btn-primary" onclick="submitRequest()">Verzoekje Versturen</button>
            </div>

            <!-- Ranking & Stemmen -->
            <div class="card">
                <h3>Live Verzoekjes & Ranking</h3>
                <div id="guestRequestsList"></div>
            </div>
        </div>

    </div>

    <script>
        let activeDjKey = null;
        let currentPartyData = null;

        const savedCode = sessionStorage.getItem('active_party_code');
        if (savedCode) {
            findDjByCode(savedCode);
        }

        function joinParty() {
            const code = document.getElementById('inputPartyCode').value.trim();
            if(!code) {
                alert('Vul een partycode in.');
                return;
            }
            findDjByCode(code);
        }

        function findDjByCode(code) {
            let foundKey = null;
            let foundData = null;

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('party_session_')) {
                    const data = JSON.parse(localStorage.getItem(key));
                    if (data && data.code === code) {
                        foundKey = key;
                        foundData = data;
                        break;
                    }
                }
            }

            if (foundKey && foundData) {
                activeDjKey = foundKey;
                currentPartyData = foundData;
                sessionStorage.setItem('active_party_code', code);
                
                const djUsername = foundKey.replace('party_session_', '');
                let branding = JSON.parse(localStorage.getItem('settings_' + djUsername));
                if (!branding) {
                    let users = JSON.parse(localStorage.getItem('party_users')) || [];
                    let uObj = users.find(u => u.username === djUsername);
                    if (uObj && uObj.company) {
                        branding = JSON.parse(localStorage.getItem('settings_' + uObj.company));
                    }
                }
                if (branding) PartyApp.applyBranding(branding);

                document.getElementById('codeSection').style.display = 'none';
                document.getElementById('guestSection').style.display = 'block';
                document.getElementById('guestWelcomeText').innerText = currentPartyData.welcome || 'Welkom op het feest! Vraag hieronder je favoriete nummers aan.';
                
                renderGuestRequests();
            } else {
                alert('Ongeldige partycode. Controleer de code.');
            }
        }

        function leaveParty() {
            sessionStorage.removeItem('active_party_code');
            location.reload();
        }

        function filterLibrary() {
            if (!currentPartyData || !currentPartyData.library) return;
            const query = document.getElementById('searchQuery').value.toLowerCase();
            const resultsDiv = document.getElementById('librarySearchResults');
            resultsDiv.innerHTML = '';

            if (!query) return;

            const filtered = currentPartyData.library.filter(t => t.artist.toLowerCase().includes(query) || t.title.toLowerCase().includes(query));
            
            filtered.forEach(track => {
                resultsDiv.innerHTML += `
                    <div onclick="selectLibraryTrack('${track.artist.replace(/'/g, "\\'")}', '${track.title.replace(/'/g, "\\'")}')" style="background: #0f0e17; padding: 10px; margin-bottom: 4px; border-radius: 6px; cursor: pointer;">
                        ${track.artist} - ${track.title}
                    </div>
                `;
            });
        }

        function selectLibraryTrack(artist, title) {
            document.getElementById('selectedTrackDisplay').innerText = `${artist} - ${title}`;
            document.getElementById('reqArtist').value = artist;
            document.getElementById('reqTitle').value = title;
            document.getElementById('librarySearchResults').innerHTML = '';
            document.getElementById('searchQuery').value = '';
        }

        function submitRequest() {
            const artist = document.getElementById('reqArtist').value.trim();
            const title = document.getElementById('reqTitle').value.trim();
            const message = document.getElementById('reqMessage').value.trim();

            if (!artist || !title) {
                alert('Vul een artiest en titel in.');
                return;
            }

            currentPartyData = JSON.parse(localStorage.getItem(activeDjKey));
            if (!currentPartyData.requests) currentPartyData.requests = [];

            currentPartyData.requests.push({
                id: Date.now(),
                artist,
                title,
                message,
                votes: 1
            });

            localStorage.setItem(activeDjKey, JSON.stringify(currentPartyData));
            
            document.getElementById('reqArtist').value = '';
            document.getElementById('reqTitle').value = '';
            document.getElementById('reqMessage').value = '';
            document.getElementById('selectedTrackDisplay').innerText = 'Geen nummer geselecteerd';
            
            alert('Verzoekje succesvol verzonden!');
            renderGuestRequests();
        }

        function voteRequest(requestId) {
            currentPartyData = JSON.parse(localStorage.getItem(activeDjKey));
            const req = currentPartyData.requests.find(r => r.id === requestId);
            if (req) {
                req.votes += 1;
                localStorage.setItem(activeDjKey, JSON.stringify(currentPartyData));
                renderGuestRequests();
            }
        }

        function renderGuestRequests() {
            if (!activeDjKey) return;
            currentPartyData = JSON.parse(localStorage.getItem(activeDjKey));
            const container = document.getElementById('guestRequestsList');
            container.innerHTML = '';

            if (!currentPartyData.requests || currentPartyData.requests.length === 0) {
                container.innerHTML = '<p style="color: #aaa;">Nog geen verzoekjes geplaatst.</p>';
                return;
            }

            currentPartyData.requests.sort((a, b) => b.votes - a.votes);

            currentPartyData.requests.forEach(req => {
                container.innerHTML += `
                    <div style="background: #0f0e17; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <b>${req.artist} - ${req.title}</b>
                            ${req.message ? `<br><small style="color: var(--primary-color);">"${req.message}"</small>` : ''}
                        </div>
                        <button onclick="voteRequest(${req.id})" class="btn-primary" style="padding: 6px 14px; width: auto; background-color: var(--accent-color);">👍 +1 (${req.votes})</button>
                    </div>
                `;
            });
        }

        setInterval(() => {
            if (activeDjKey) {
                let updatedData = JSON.parse(localStorage.getItem(activeDjKey));
                if (updatedData) {
                    currentPartyData = updatedData;
                    renderGuestRequests();
                }
            }
        }, 2000);
    </script>
</body>
</html>
