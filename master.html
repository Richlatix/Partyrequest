<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Partyrequest — MASTER ADMIN</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0d0f12; --card-bg: rgba(26, 29, 36, 0.72); --card-border: rgba(255, 255, 255, 0.1);
      --accent-color: #ff3b30; --accent-gradient: linear-gradient(135deg, #ff3b30, #ff9500);
      --text-main: #f5f5f7; --text-sub: #8e8e93; --success-color: #34c759; --danger-color: #ff3b30;
      --radius-xl: 24px; --radius-lg: 16px; --radius-md: 12px; --blur-val: blur(20px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 800px; padding: 20px; display: flex; flex-direction: column; }
    .glass-card { background: var(--card-bg); backdrop-filter: var(--blur-val); border: 1px solid var(--card-border); border-radius: var(--radius-xl); padding: 24px; margin-bottom: 20px; }
    .btn { width: 100%; padding: 14px 20px; border-radius: var(--radius-lg); border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: #fff; }
    .btn-primary { background: var(--accent-gradient); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--card-border); color: #fff;}
    .btn-sm { padding: 8px 14px; font-size: 0.82rem; border-radius: var(--radius-md); width: auto; }
    .btn-danger { background: rgba(255, 59, 48, 0.15); color: var(--danger-color); border: 1px solid rgba(255, 59, 48, 0.3); }
    .input-field { width: 100%; padding: 14px 16px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--card-border); border-radius: var(--radius-lg); color: #fff; font-size: 0.95rem; outline: none; margin-bottom: 12px; }
    .input-field:focus { border-color: var(--accent-color); }
    .hidden { display: none !important; }
    .flex-row { display: flex; gap: 10px; align-items: center; }
    
    .stat-box { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 16px; text-align: center; }
    .stat-num { font-size: 2rem; font-weight: 800; color: var(--accent-color); }
    
    .company-item { background: rgba(0,0,0,0.2); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; position: relative; }
    .dj-list-box { background: rgba(0,0,0,0.4); border-radius: var(--radius-md); padding: 12px; margin-top: 12px; }
    
    .live-feed-box { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: var(--radius-lg); max-height: 250px; overflow-y: auto; padding: 10px; }
    .live-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }

    .toast-popup {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(20, 22, 28, 0.95);
      color: #ffffff; border: 1px solid var(--accent-color); padding: 14px 24px; border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 9999; font-weight: 700; text-align: center; min-width: 280px;
      animation: fadeInOut 3s ease forwards; backdrop-filter: blur(10px);
    }
    @keyframes fadeInOut { 0% { opacity: 0; transform: translate(-50%, 20px); } 15% { opacity: 1; transform: translate(-50%, 0); } 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -10px); } }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- LOGIN SCHERM -->
    <div id="login-view" class="glass-card text-center" style="margin-top: 10vh;">
      <div style="font-size: 3rem; margin-bottom: 10px;">👑</div>
      <h2 style="font-size: 1.5rem; margin-bottom: 6px;">Master Admin</h2>
      <p style="color: var(--text-sub); font-size: 0.88rem; margin-bottom: 24px;">Exclusieve toegang voor eigenaar.</p>
      <input type="email" id="login-email" class="input-field" placeholder="E-mailadres">
      <input type="password" id="login-password" class="input-field" placeholder="Wachtwoord" onkeydown="if(event.key==='Enter') loginMaster()">
      <button class="btn btn-primary mt-4" onclick="loginMaster()">Inloggen als Baas</button>
      
      <button class="btn btn-secondary mt-2 hidden" id="force-logout-btn" onclick="logoutMaster()">Log huidig test-account uit</button>
    </div>

    <!-- DASHBOARD SCHERM -->
    <div id="dashboard-view" class="hidden">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 style="font-size: 1.3rem;">👑 Master Dashboard</h2>
        <button class="btn btn-sm btn-secondary" onclick="logoutMaster()">Uitloggen</button>
      </div>

      <!-- LIVE FEED -->
      <div class="glass-card">
        <h3 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--success-color);">🟢 Live Verzoekjes Feed</h3>
        <div class="live-feed-box" id="live-feed-container">
            <p style="color:var(--text-sub); text-align:center;">Verzoekjes laden...</p>
        </div>
      </div>

      <!-- STATISTIEKEN -->
      <div class="flex-row" style="margin-bottom: 20px;">
        <div class="stat-box">
          <div class="stat-num" id="stat-companies">0</div>
          <div style="font-size: 0.8rem; color: var(--text-sub);">Bedrijven</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="stat-djs">0</div>
          <div style="font-size: 0.8rem; color: var(--text-sub);">Actieve DJ's</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="stat-requests">0</div>
          <div style="font-size: 0.8rem; color: var(--text-sub);">Totale Verzoekjes</div>
        </div>
      </div>

      <!-- BEDRIJVEN & DJ BEHEREN -->
      <div class="glass-card">
        <h3 style="font-size: 1.1rem; color: var(--accent-color); margin-bottom: 16px;">🏢 Aangesloten Bedrijven & DJ's</h3>
        <div id="companies-list">Laden...</div>
      </div>

      <!-- GLOBALE BLACKLIST -->
      <div class="glass-card">
        <h3 style="font-size: 1.1rem; margin-bottom: 16px;">🛡️ Landelijke Blacklist (Voor alle feesten)</h3>
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
          <input type="text" id="global-blacklist-input" class="input-field" style="margin: 0;" placeholder="Woord uitsluiten voor alle DJ's..." onkeydown="if(event.key==='Enter') addGlobalBlacklistWord()">
          <button class="btn btn-sm btn-secondary" onclick="addGlobalBlacklistWord()">Voeg toe</button>
        </div>
        <div id="global-blacklist-container" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://wiimebmtizhquwzjrixa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-TyLItKUkPl28wpvaeFQAw_kQj7ZReu";
    
    let dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { storageKey: 'master-admin-session' }
    });
    
    let globalBlacklist = [];

    function toonPopup(bericht) {
      const oude = document.getElementById('custom-toast');
      if (oude) oude.remove();
      const p = document.createElement('div'); p.id = 'custom-toast'; p.className = 'toast-popup'; p.innerText = bericht;
      document.body.appendChild(p); setTimeout(() => { if (p) p.remove(); }, 4000);
    }

    dbClient.auth.onAuthStateChange(async (event, session) => {
      if (session) {
        const { data, error } = await dbClient.from('super_admins').select('id').eq('id', session.user.id).single();
        if (data) {
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('dashboard-view').classList.remove('hidden');
          loadMasterData();
          loadLiveFeed();
          listenToRealtime();
        } else {
          document.getElementById('login-view').classList.remove('hidden');
          document.getElementById('dashboard-view').classList.add('hidden');
          document.getElementById('force-logout-btn').classList.remove('hidden');
          if(event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
             toonPopup('⚠️ Je hebt geen Master Admin rechten op dit account.');
          }
        }
      } else {
        document.getElementById('login-view').classList.remove('hidden');
        document.getElementById('dashboard-view').classList.add('hidden');
        document.getElementById('force-logout-btn').classList.add('hidden');
      }
    });

    async function loginMaster() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      if (!email || !password) return toonPopup('Vul alles in!');
      const { error } = await dbClient.auth.signInWithPassword({ email, password });
      if (error) toonPopup('Inloggen mislukt: ' + error.message);
    }

    async function logoutMaster() { await dbClient.auth.signOut(); location.reload(); }

    function listenToRealtime() {
        dbClient.channel('master-feed')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'requests' }, () => {
              loadLiveFeed(); loadMasterData();
          }).subscribe();
    }

    async function loadLiveFeed() {
        const { data } = await dbClient.from('requests').select('title, artist, party_code, djs(dj_name)').order('created_at', { ascending: false }).limit(30);
        const container = document.getElementById('live-feed-container');
        if (!data || data.length === 0) { container.innerHTML = '<p style="color:var(--text-sub); text-align:center;">Nog geen verzoekjes.</p>'; return; }
        container.innerHTML = data.map(req => {
            const djName = req.djs ? req.djs.dj_name : 'Onbekende DJ';
            return `
            <div class="live-item">
                <div><strong style="font-size:0.9rem;">${req.title}</strong> <span style="font-size:0.8rem; color:var(--text-sub);">- ${req.artist}</span></div>
                <div style="text-align:right;">
                    <div style="font-size:0.75rem; color:var(--accent-color); font-weight:bold;">${djName}</div>
                    <div style="font-size:0.7rem; color:var(--text-sub);">CODE: ${req.party_code}</div>
                </div>
            </div>`;
        }).join('');
    }

    async function loadMasterData() {
      const { data: comps } = await dbClient.from('companies').select('*, djs(*)');
      const { count: djCount } = await dbClient.from('djs').select('*', { count: 'exact', head: true });
      const { count: reqCount } = await dbClient.from('requests').select('*', { count: 'exact', head: true });
      
      document.getElementById('stat-companies').innerText = comps ? comps.length : 0;
      document.getElementById('stat-djs').innerText = djCount || 0;
      document.getElementById('stat-requests').innerText = reqCount || 0;

      const compList = document.getElementById('companies-list');
      if (!comps || comps.length === 0) { compList.innerHTML = '<p style="color:var(--text-sub);">Nog geen bedrijven in het systeem.</p>'; } 
      else {
        compList.innerHTML = comps.map(c => {
          const endDate = c.subscription_end_date ? new Date(c.subscription_end_date).toLocaleDateString('nl-NL') : 'Niet actief';
          const isExpired = c.subscription_end_date && new Date(c.subscription_end_date) < new Date();
          const color = isExpired ? 'var(--danger-color)' : 'var(--success-color)';
          
          let djsHtml = '';
          if (c.djs && c.djs.length > 0) {
              djsHtml = '<div class="dj-list-box"><h4 style="font-size:0.85rem; margin-bottom:8px; color:var(--text-sub);">DJ Accounts:</h4>' + 
              c.djs.map(dj => `
                  <div style="display:flex; gap:8px; margin-bottom:6px;">
                      <input type="text" id="dj-name-${dj.id}" class="input-field" style="padding:6px; margin:0; font-size:0.8rem; flex:1;" value="${dj.dj_name}">
                      <input type="text" id="dj-code-${dj.id}" class="input-field" style="padding:6px; margin:0; width:70px; font-size:0.8rem; text-align:center;" value="${dj.dj_code}">
                      <button class="btn btn-sm btn-secondary" title="Sla DJ op" onclick="masterUpdateDJ('${dj.id}')">💾</button>
                  </div>
              `).join('') + '</div>';
          } else { djsHtml = '<div class="dj-list-box"><p style="font-size:0.8rem; color:var(--text-sub); margin:0;">Dit bedrijf heeft nog geen DJ\'s aangemaakt.</p></div>'; }

          // Knop om het complete bedrijf veilig te verwijderen (via de backend RPC)
          const deleteBtnHtml = `
            <button class="btn btn-sm btn-danger" style="position: absolute; top: 20px; right: 20px; width: auto;" 
                    onclick="deleteCompanyCompletely('${c.id}', '${c.company_name.replace(/'/g, "\\'")}')" 
                    title="Verwijder Bedrijf">
              🗑️ Wis Bedrijf
            </button>
          `;

          return `
            <div class="company-item">
              ${deleteBtnHtml}
              <div style="margin-bottom: 8px; padding-right: 100px;">
                <strong style="font-size: 1.1rem; display: block;">${c.company_name}</strong>
                <span style="font-size: 0.8rem; color: ${color}; font-weight:bold;">Abo: ${endDate}</span>
              </div>
              <div style="font-size: 0.75rem; color: var(--text-sub); margin-bottom: 12px;">UID: ${c.id}</div>
              
              <div style="display:flex; gap: 8px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px;">
                <input type="date" id="date-${c.id}" class="input-field" style="padding: 6px; margin: 0; font-size: 0.8rem;" value="${c.subscription_end_date ? c.subscription_end_date.split('T')[0] : ''}">
                <input type="number" id="dj-${c.id}" class="input-field" style="padding: 6px; margin: 0; width: 60px; font-size: 0.8rem;" value="${c.max_djs}">
                <button class="btn btn-sm btn-secondary" style="background:var(--accent-color); border:none;" onclick="updateCompany('${c.id}')">Abo Opslaan</button>
              </div>
              ${djsHtml}
            </div>`;
        }).join('');
      }

      const { data: settings } = await dbClient.from('master_settings').select('global_blacklist').eq('id', 1).single();
      if (settings && settings.global_blacklist) { globalBlacklist = settings.global_blacklist; renderGlobalBlacklist(); }
    }

    async function updateCompany(id) {
      const newDate = document.getElementById(`date-${id}`).value;
      const newMax = document.getElementById(`dj-${id}`).value;
      
      if (!newDate) {
          const confirmEmpty = confirm("Je hebt de datum leeg gelaten (of niet volledig ingevuld). Wil je het abonnement hiermee stopzetten?");
          if (!confirmEmpty) return;
      }
      
      toonPopup('Bezig met opslaan...');
      const updatePayload = {
        subscription_end_date: newDate ? new Date(newDate).toISOString() : null,
        max_djs: newMax ? parseInt(newMax) : 0
      };

      const { error } = await dbClient.from('companies').update(updatePayload).eq('id', id);
      if (error) { toonPopup('Fout bij opslaan: ' + error.message); } else { toonPopup('✅ Abonnement succesvol aangepast!'); loadMasterData(); }
    }

    async function masterUpdateDJ(djId) {
        const newName = document.getElementById(`dj-name-${djId}`).value.trim();
        const newCode = document.getElementById(`dj-code-${djId}`).value.trim();
        if(!newName || !newCode) return toonPopup('Vul naam en code in.');

        const { error } = await dbClient.from('djs').update({ dj_name: newName, dj_code: newCode }).eq('id', djId);
        if (error) {
            if(error.code === '23505') toonPopup('Fout: Inlogcode is al in gebruik!');
            else toonPopup('Update mislukt: ' + error.message);
        } else { toonPopup('DJ Gegevens overschreven!'); loadMasterData(); }
    }

    // NIEUW: Functie om via de RPC de inlog + bedrijfsdata te wissen
    async function deleteCompanyCompletely(companyId, companyName) {
        const confirmDelete = confirm(`🚨 GEVAAR: Weet je 100% zeker dat je '${companyName}' wilt verwijderen?\n\nDit wist per direct hun account, het e-mailadres, alle DJ's en de bibliotheek. Dit kan niet ongedaan worden gemaakt.`);
        
        if (confirmDelete) {
            toonPopup('Bezig met compleet wissen...');
            
            // We roepen de nieuwe beveiligde functie (RPC) aan in de database
            const { error } = await dbClient.rpc('delete_company_completely', { company_uid: companyId });
            
            if (error) {
                console.error("Delete Error:", error);
                toonPopup('Fout bij wissen: ' + error.message);
            } else {
                toonPopup('✅ Bedrijf en account zijn volledig gewist!');
                loadMasterData();
            }
        }
    }

    async function addGlobalBlacklistWord() {
      const input = document.getElementById('global-blacklist-input');
      const word = input.value.trim().toLowerCase();
      if (word && !globalBlacklist.includes(word)) {
        globalBlacklist.push(word);
        await dbClient.from('master_settings').update({ global_blacklist: globalBlacklist }).eq('id', 1);
        input.value = ''; renderGlobalBlacklist();
      }
    }

    async function removeGlobalBlacklistWord(word) {
      globalBlacklist = globalBlacklist.filter(w => w !== word);
      await dbClient.from('master_settings').update({ global_blacklist: globalBlacklist }).eq('id', 1);
      renderGlobalBlacklist();
    }

    function renderGlobalBlacklist() {
      const container = document.getElementById('global-blacklist-container');
      container.innerHTML = globalBlacklist.map(w => `
        <span style="background: rgba(255, 59, 48, 0.2); border: 1px solid var(--danger-color); padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px;">
          ${w} <span style="cursor:pointer; font-weight:bold;" onclick="removeGlobalBlacklistWord('${w}')">✕</span>
        </span>
      `).join('');
    }
  </script>
</body>
</html>
