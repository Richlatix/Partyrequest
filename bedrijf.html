<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Bedrijfspagina Beheer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; }
        nav { background: #333; color: #fff; padding: 10px; display: flex; gap: 15px; }
        nav a { color: #fff; text-decoration: none; cursor: pointer; }
        .section { display: none; background: #fff; padding: 20px; margin-top: 20px; border-radius: 5px; }
        .section.active { display: block; }
        form div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007BFF; color: white; border: none; padding: 10px 15px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1>Beheeromgeving Bedrijf</h1>
    
    <!-- Menubalk om te schakelen tussen onderdelen op dezelfde pagina -->
    <nav>
        <a onclick="toonSectie('huisstijl')">Huisstijl</a>
        <a onclick="toonSectie('contact')">Contactgegevens</a>
        <a onclick="toonSectie('djs')">DJ's Beheren</a>
        <a onclick="toonSectie('wachtwoord')">Wachtwoord Wijzigen</a>
    </nav>

    <!-- 1. Huisstijl Sectie -->
    <div id="huisstijl" class="section active">
        <h2>Huisstijl Aanpassen</h2>
        <form>
            <div>
                <label>Bedrijfslogo uploaden:</label>
                <input type="file" accept="image/*">
            </div>
            <div>
                <label>Primairekleur:</label>
                <input type="color" value="#007BFF">
            </div>
            <button type="submit">Opslaan</button>
        </form>
    </div>

    <!-- 2. Contactgegevens Sectie -->
    <div id="contact" class="section">
        <h2>Contactgegevens Aanpassen</h2>
        <form>
            <div>
                <label>E-mailadres:</label>
                <input type="email" value="info@jouwbedrijf.nl">
            </div>
            <div>
                <label>Telefoonnummer:</label>
                <input type="tel" value="0612345678">
            </div>
            <button type="submit">Opslaan</button>
        </form>
    </div>

    <!-- 3. DJ's Beheren Sectie -->
    <div id="djs" class="section">
        <h2>DJ's Beheren</h2>
        <p>Hier zie je een overzicht van je solo-dj's. Je kunt er hier een toevoegen of verwijderen.</p>
        <button type="button">+ DJ Toevoegen</button>
        <!-- Lijst met bestaande DJ's komt hier -->
    </div>

    <!-- 4. Wachtwoord Wijzigen Sectie -->
    <div id="wachtwoord" class="section">
        <h2>Wachtwoord Wijzigen</h2>
        <form>
            <div>
                <label>Huidig wachtwoord:</label>
                <input type="password" required>
            </div>
            <div>
                <label>Nieuw wachtwoord:</label>
                <input type="password" required>
            </div>
            <div>
                <label>Bevestig nieuw wachtwoord:</label>
                <input type="password" required>
            </div>
            <button type="submit">Wachtwoord Wijzigen</button>
        </form>
    </div>

    <script>
        // Simpele JavaScript functie om te wisselen tussen de tabbladen
        function toonSectie(id) {
            const secties = document.querySelectorAll('.section');
            secties.forEach(sec => sec.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>

</body>
</html>
