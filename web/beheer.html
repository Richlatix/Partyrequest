<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">
<title>Beheer – PartyRequest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<header class="sticky-hdr">
  <div class="logo-s" id="logo-s"></div>
  <div class="grow"><div class="brandname">PartyRequest</div><div class="brandsub" id="who">Beheer · MXT Productions</div></div>
  <a class="btn sm hide-sm" href="index.html">Gastenpagina</a>
  <button id="btn-out" class="btn sm hidden" data-act="logout">Uitloggen</button>
</header>

<main class="dash">
  <section id="login" class="card" style="max-width:440px;margin:40px auto">
    <div class="kick">Beheer</div>
    <h1 style="margin-top:8px;font-size:34px">Inloggen</h1>
    <p class="sub2" style="margin-top:8px">Voor beheerders en bedrijven.</p>
    <form id="f-login">
      <label class="f" for="l-email">E-mailadres</label><input id="l-email" type="email" autocomplete="username" required>
      <label class="f" for="l-pw">Wachtwoord</label><input id="l-pw" type="password" autocomplete="current-password" required>
      <button class="btn primary block" style="margin-top:20px" type="submit">Inloggen</button>
    </form>
  </section>
  <section id="app" class="hidden"><div id="view"></div></section>
</main>
<div id="modal" class="modal hidden"><div class="box" id="modal-box"></div></div>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="beheer.js"></script>
</body>
</html>
