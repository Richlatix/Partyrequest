<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PartyRequest by MXT Productions</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.k-wrap{max-width:560px;margin:0 auto;padding:48px 24px 40px}
.k-stripes{line-height:0;margin-bottom:24px}
.k-card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px;margin-top:14px;transition:border-color .15s}
.k-card:hover,.k-card:focus-visible{border-color:var(--accent)}
.k-card b{display:block;font-size:20px}
.k-card span{display:block;margin-top:6px;font-size:14px;color:var(--sub);line-height:1.5}
.k-foot{margin-top:36px;text-align:center;font-size:13px;color:var(--sub)}
.k-foot a{color:var(--sub)}
</style>
</head>
<body>
<main class="k-wrap">
  <div class="k-stripes" id="k-stripes"></div>
  <div class="brandname" style="font-size:30px">PartyRequest</div>
  <div class="brandsub">by MXT Productions</div>
  <h1 style="margin:32px 0 0;font-size:30px;line-height:1.15">Waar wil je naartoe?</h1>
  <a class="k-card" href="beheer.html"><b>Inloggen voor bedrijven</b><span>Beheer je DJ's, feesten, abonnement en huisstijl.</span></a>
  <a class="k-card" href="feest.html#dj"><b>Inloggen als DJ</b><span>Met je e-mailadres en de code van 6 cijfers.</span></a>
  <p class="k-foot">Ben je gast op een feest? Scan de QR-code van de DJ.<br><a href="https://mxtproductions.nl/partyrequest/">Meer over PartyRequest</a></p>
</main>
<script src="common-lite.js"></script>
</body>
</html>
