<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ Dashboard | Verzoekjes</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #7dff00; /* Wordt overschreven door bedrijfsstijl */
      --border-color: #2a2a2a;
      --subtext-color: #b0b0b0;
    }

    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: var(--bg-color); 
      color: var(--text-color); 
      padding: 20px; 
      max-width: 800px; 
      margin: auto; 
    }

    h1, h2, h3 { color: var(--accent-color); text-align: center; }
    
    input, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--border-color); box-sizing: border-box; font-family: inherit; background: var(--card-bg); color: var(--text-color); }
    button { background: var(--accent-color); color: #121212; font-weight: bold; cursor: pointer; border: none; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    
    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); }
    .hidden { display: none !important; }
    
    .request-item { background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid var(--accent-color); display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .request-info { flex: 1; }
    .request-comment { font-size: 0.85em; color: var(--subtext-color); margin-top: 6px; font-style: italic; }
    
    .actions { display: flex; gap: 8px; }
    .btn-action { width: auto; padding: 8px 14px; font-size: 0.85em; margin: 0; }
    .btn-done { background: #2ecc71; color: #fff; }
    .btn-delete { background: #e74c3c; color: #fff; }

    .toast-popup {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e1e;
      color: #ffffff;
      border: 1.5px solid var(--accent-color);
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
      z-index: 9999;
      font-weight: bold;
      text-align: center;
      max-width: 90%;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <!-- DJ INLOGSCHERM -->
  <div id="dj-login-view" style="max-width: 400px; margin: 60px auto; text-align: center;">
    <h2>🎛️ DJ Dashboard Inloggen</h2>
    <p style="color:var(--subtext-color); font-size: 0.9em;">Voer je DJ-code in:</p>
    <input type="text" id="dj-code-input" placeholder="Bijv. 0155" style="text-align:center; font-size: 1.5em; letter-spacing: 2px;">
    <button onclick="loginDj()">Inloggen 🚀</button>
  </div>

  <!-- DJ HOOFDSCHERM -->
  <div id="dj-dashboard" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>🎛️ Beheer Verzoekjes</h2>
      <button onclick="logoutDj()" style="background: transparent; color: var(--subtext-color); border: none; width: auto; font-size: 0.85em; cursor: pointer; text-decoration: underline;">Uitloggen</button>
    </div>

    <!-- WELKOMSTTEKST BEWERKEN -->
    <div class="card">
      <h3 style="margin-top:0; text-align:left; font-size: 1.1em;">💬 Welkomsttekst voor gasten</h3>
      <textarea id="welcome-text-input" placeholder="Bijv. Welkom op ons feest! Vraag hier je favoriete nummers aan..." rows="2"></textarea>
      <button onclick="saveWelcomeText()" style="width: auto; padding: 8px 16px; font-size: 0.9em;">Opslaan</button>
    </div>

    <!-- INKOMENDE VERZOEKJES -->
    <div class="card">
      <h3 style="margin-top:0; text-align:left; font-size: 1.1em;">📋 Ontvangen Verzoekjes</h3>
      <div id="dj-requests-list">
        <p style="color:var(--subtext-color); font-size:0.85em;">Nog geen verzoekjes ontvangen...</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yhitywueffetjjnoudkt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UVo2rR8P1p3eH6Un0Mn1rw_4AnBv1po";

    let dbClient = null;
    let currentDjId = null;
    let realtimeSubscription = null;

    function toonPopup(bericht) {
      const oudePopup = document.getElementById('custom-toast');
      if (oudePopup) oudePopup.remove();

      const popup = document.createElement('div');
      popup.id = 'custom-toast';
      popup.className = 'toast-popup';
      popup.innerText = bericht;

      document.body.appendChild(popup);
      setTimeout(() => { if (popup) popup.remove(); }, 4000);
    }

    function initSupabase() {
      if (!dbClient) {
        dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    }

    window.onload = function() {
      initSupabase();
      const savedDjCode = localStorage.getItem('active_dj_code');
      if (savedDjCode) {
        document.getElementById('dj-code-input').value = savedDjCode;
        loginDj(true);
      }
    };

    async function loginDj(isAutoLogin = false) {
      const djCode = document.getElementById('dj-code-input').value.trim();
      if (!djCode) {
        if (!isAutoLogin) toonPopup('Voer je DJ-code in!');
        return;
      }

      initSupabase();

      // Haal DJ gegevens op inclusief gekoppeld bedrijf (voor de huisstijlkleur)
      const { data: djData, error } = await dbClient
        .from('djs')
        .select('*, companies(*)')
        .eq('dj_code', djCode)
        .single();

      if (error || !djData) {
        if (!isAutoLogin) toonPopup('Ongeldige DJ-code.');
        localStorage.removeItem('active_dj_code');
        return;
      }

      currentDjId = djData.id;
      localStorage.setItem('active_dj_code', djCode);

      // Dynamisch de huisstijlkleur van het bedrijf toepassen als deze bestaat
      if (djData.companies && djData.companies.accent_color) {
        document.documentElement.style.setProperty('--accent-color', djData.companies.accent_color);
      }

      document.getElementById('welcome-text-input').value = djData.welcome_text || '';
      document.getElementById('dj-login-view').classList.add('hidden');
      document.getElementById('dj-dashboard').classList.remove('hidden');

      loadDjRequests();
      setupRealtimeListener();
    }

    function logoutDj() {
      localStorage.removeItem('active_dj_code');
      if (realtimeSubscription) dbClient.removeChannel(realtimeSubscription);
      document.getElementById('dj-dashboard').classList.add('hidden');
      document.getElementById('dj-login-view').classList.remove('hidden');
      document.getElementById('dj-code-input').value = '';
    }

    async function saveWelcomeText() {
      const text = document.getElementById('welcome-text-input').value.trim();
      const { error } = await dbClient
        .from('djs')
        .update({ welcome_text: text })
        .eq('id', currentDjId);

      if (error) {
        toonPopup('Fout bij opslaan: ' + error.message);
      } else {
        toonPopup('Welkomsttekst bijgewerkt! 🎉');
      }
    }

    async function loadDjRequests() {
      const { data, error } = await dbClient
        .from('requests')
        .select('*')
        .eq('dj_id', currentDjId)
        .eq('status', 'pending')
        .order('likes', { ascending: false })
        .order('created_at', { ascending: false });

      const listContainer = document.getElementById('dj-requests-list');
      listContainer.innerHTML = '';

      if (error || !data || data.length === 0) {
        listContainer.innerHTML = '<p style="color:var(--subtext-color); font-size:0.85em;">Nog geen openstaande verzoekjes...</p>';
        return;
      }

      data.forEach(req => {
        const commentHtml = req.comment ? `<div class="request-comment">💬 "${req.comment}"</div>` : '';

        listContainer.innerHTML += `
          <div class="request-item">
            <div class="request-info">
              <strong>🎵 ${req.song_title}</strong> - <span style="color:var(--subtext-color);">${req.artist}</span>
              <div style="font-size: 0.85em; color: var(--accent-color); margin-top: 4px;">👍 Likes: ${req.likes || 0}</div>
              ${commentHtml}
            </div>
            <div class="actions">
              <button class="btn-action btn-done" onclick="completeRequest('${req.id}')">Gedraaid ✓</button>
              <button class="btn-action btn-delete" onclick="deleteRequest('${req.id}')">Verwijder ✕</button>
            </div>
          </div>`;
      });
    }

    async function completeRequest(id) {
      const { error } = await dbClient.from('requests').update({ status: 'completed' }).eq('id', id);
      if (error) toonPopup('Fout bij bijwerken: ' + error.message);
      else loadDjRequests();
    }

    async function deleteRequest(id) {
      const { error } = await dbClient.from('requests').delete().eq('id', id);
      if (error) toonPopup('Fout bij verwijderen: ' + error.message);
      else loadDjRequests();
    }

    function setupRealtimeListener() {
      if (!currentDjId) return;

      realtimeSubscription = dbClient
        .channel('public:dj_requests')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'requests', filter: `dj_id=eq.${currentDjId}` }, payload => {
          loadDjRequests();
        })
        .subscribe();
    }
  </script>
</body>
</html>
