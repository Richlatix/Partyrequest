<script>
        const user = PartyApp.getCurrentUser();
        if (!user || (user.role !== 'dj' && user.role !== 'solo_dj' && user.role !== 'company_dj' && user.role !== 'company')) {
            window.location.href = 'login.html';
        }

        let partyData = null;

        // Haalt feilloos de juiste kleuren en bedrijfsnaam op per specifiek profiel
        async function applyLatestBranding() {
            let targetUsername = user.username;
            
            if (user.role === 'company_dj' && user.company) {
                // Bedrijfs-DJ gebruikt de instellingen van het specifieke moederbedrijf
                targetUsername = user.company;
                const headerTitle = document.getElementById('brandHeaderTitle');
                if (headerTitle) {
                    headerTitle.innerText = user.company.toUpperCase();
                }
            } else if (user.role === 'company') {
                const headerTitle = document.getElementById('brandHeaderTitle');
                if (headerTitle) {
                    headerTitle.innerText = user.username.toUpperCase();
                }
            }

            // Haal de sessie op van dit specifieke profiel
            let freshSession = await PartyApp.db.getSession(targetUsername);
            if (freshSession) {
                PartyApp.applyBranding({ 
                    primaryColor: freshSession.primary_color, 
                    backgroundColor: freshSession.background_color 
                });
            }
        }

        async function initDj() {
            // Bepaal de juiste sessie-data om te laden
            let sessionTarget = (user.role === 'company_dj' && user.company) ? user.username : user.username;
            partyData = await PartyApp.db.getSession(sessionTarget);
            if (!partyData) return;

            document.getElementById('currentPartyCode').innerText = partyData.party_code;
            document.getElementById('welcomeText').value = partyData.welcome_text || '';
            updateLibraryCount();
            renderLiveRequests();

            if (user.role === 'solo_dj') {
                document.getElementById('soloBrandingCard').style.display = 'block';
                document.getElementById('soloPrimary').value = partyData.primary_color || '#3b82f6';
                document.getElementById('soloBg').value = partyData.background_color || '#0a0f1d';
            }

            await applyLatestBranding();
        }
