<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partyrequest - DJ Dashboard</title>
    <script src="style.js"></script>
</head>
<body>
    <div class="container" style="padding-top: 40px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>DJ Dashboard</h1>
            <button class="btn-primary" onclick="PartyApp.logout()" style="width: auto;">Uitloggen</button>
        </div>

        <!-- Partycode & Einde Evenement -->
        <div class="card" style="margin-bottom: 20px;">
            <h3>Actieve Partycode</h3>
            <p style="font-size: 32px; font-weight: bold; color: var(--primary-color); margin: 10px 0;" id="currentPartyCode">------</p>
            <button class="btn-primary" onclick="generateNewPartyCode()" style="background-color: var(--accent-color); margin-bottom: 15px;">Nieuwe Partycode Maken (Einde Evenement)</button>
            
            <label>Welkomsttekst voor Gastenpagina:</label>
            <textarea id="welcomeText" rows="3" placeholder="Welkom! Vraag hier je favoriete nummer aan..."></textarea>
            <button class="btn-primary" onclick="saveWelcomeText()">Welkomsttekst Opslaan</button>
        </div>

        <!-- Solo DJ Huisstijl (Bedrijfs-DJ's zien dit niet) -->
        <div id="soloBrandingCard" class="card" style="margin-bottom: 20px; display: none;">
            <h3>Huisstijl Aanpassen (Solo DJ)</h3>
            <label>Primair Kleur:</label>
            <input type="color" id="soloPrimary" value="#ff3366" style="height: 45px; padding: 2px;">
            <label>Achtergrond Kleur:</label>
            <input type="color" id="soloBg" value="#0f0e17" style="height: 45px; padding: 2px;">
            <button class="btn-primary" onclick="saveSoloBranding()">Huisstijl Opslaan</button>
        </div>

        <!-- Library Upload & Handmatig -->
        <div class="card" style="margin-bottom: 20px;">
            <h3>Muziek Library Beheren</h3>
            <label>Upload Rekordbox / Nummer XML:</label>
            <input type="file" id="xmlFile" accept=".xml">
            <button class="btn-primary" onclick="uploadXml()">Library Importeren</button>
            
            <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
            
            <label>Handmatig Nummer Toevoegen:</label>
            <input type="text" id="manualArtist" placeholder="Artiest">
            <input type="text" id="manualTitle" placeholder="Titel">
            <button class="btn-primary" onclick="addManualTrack()">Toevoegen</button>
            <p id="libraryCount" style="margin-top: 10px; font-size: 14px; color: #aaa;"></p>
        </div>

        <!-- Live Verzoekjes & Stemmen -->
        <div class="card">
            <h3>Live Verzoekjes & Ranking</h3>
            <div id="liveRequests"></div>
        </div>
    </div>

    <script>
        const user = PartyApp.getCurrentUser();
        if (!user || (user.role !== 'dj' && user.role !== 'solo_dj' && user.role !== 'company_dj')) {
            window.location.href = 'login.html';
        }

        // Huisstijl toepassen
        if (user.role === 'solo_dj') {
            document.getElementById('soloBrandingCard').style.display = 'block';
            let branding = JSON.parse(localStorage.getItem('settings_' + user.username));
            if (branding) {
                PartyApp.applyBranding(branding);
                document.getElementById('soloPrimary').value = branding.primaryColor || '#ff3366';
                document.getElementById('soloBg').value = branding.backgroundColor || '#0f0e17';
            }
        } else if (user.company) {
            let companyBranding = JSON.parse(localStorage.getItem('settings_' + user.company));
            if (companyBranding) PartyApp.applyBranding(companyBranding);
        }

        let partyData = JSON.parse(localStorage.getItem('party_session_' + user.username)) || { code: generateCode(), welcome: '', library: [], requests: [] };
        if (!partyData.code) {
            partyData.code = generateCode();
            localStorage.setItem('party_session_' + user.username, JSON.stringify(partyData));
        }

        document.getElementById('currentPartyCode').innerText = partyData.code;
        document.getElementById('welcomeText').value = partyData.welcome || '';
        updateLibraryCount();
        renderLiveRequests();

        function generateCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        function generateNewPartyCode() {
            partyData.code = generateCode();
            partyData.requests = []; // Vorige gastenverzoekjes wissen
            localStorage.setItem('party_session_' + user.username, JSON.stringify(partyData));
            document.getElementById('currentPartyCode').innerText = partyData.code;
            renderLiveRequests();
            alert('Nieuwe partycode gegenereerd! Vorige sessie is gereset.');
        }

        function saveWelcomeText() {
            partyData.welcome = document.getElementById('welcomeText').value;
            localStorage.setItem('party_session_' + user.username, JSON.stringify(partyData));
            alert('Welkomsttekst opgeslagen!');
        }

        function saveSoloBranding() {
            let branding = {
                primaryColor: document.getElementById('soloPrimary').value,
                backgroundColor: document.getElementById('soloBg').value
            };
            localStorage.setItem('settings_' + user.username, JSON.stringify(branding));
            PartyApp.applyBranding(branding);
            alert('Huisstijl opgeslagen!');
        }

        function uploadXml() {
            const fileInput = document.getElementById('xmlFile');
            if(fileInput.files.length === 0) {
                alert('Kies eerst een XML-bestand.');
                return;
            }
            const reader = new FileReader();
            reader.onload = function() {
                // Simulatie van XML parsing
                const dummyTracks = [
                    { artist: "David Guetta", title: "Titanium" },
                    { artist: "Swedish House Mafia", title: "Don't You Worry Child" },
                    { artist: "Avicii", title: "Levels" }
                ];
                partyData.library = partyData.library.concat(dummyTracks);
                localStorage.setItem('party_session_' + user.username, JSON.stringify(partyData));
                updateLibraryCount();
                alert('Library succesvol geïmporteerd!');
            };
            reader.readAsText(fileInput.files[0]);
        }

        function addManualTrack() {
            const artist = document.getElementById('manualArtist').value.trim();
            const title = document.getElementById('manualTitle').value.trim();
            if(!artist || !title) {
                alert('Vul artiest en titel in.');
                return;
            }
            partyData.library.push({ artist, title });
            localStorage.setItem('party_session_' + user.username, JSON.stringify(partyData));
            document.getElementById('manualArtist').value = '';
            document.getElementById('manualTitle').value = '';
            updateLibraryCount();
            alert('Nummer toegevoegd aan library!');
        }

        function updateLibraryCount() {
            document.getElementById('libraryCount').innerText = `Aantal nummers in library: ${partyData.library.length}`;
        }

        function renderLiveRequests() {
            let currentData = JSON.parse(localStorage.getItem('party_session_' + user.username)) || partyData;
            const container = document.getElementById('liveRequests');
            container.innerHTML = '';
            
            if(!currentData.requests || currentData.requests.length === 0) {
                container.innerHTML = '<p style="color: #aaa;">Nog geen verzoekjes ontvangen.</p>';
                return;
            }

            currentData.requests.sort((a, b) => b.votes - a.votes);

            currentData.requests.forEach((req) => {
                container.innerHTML += `
                    <div style="background: #0f0e17; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <b>${req.artist} - ${req.title}</b>
                            ${req.message ? `<br><small style="color: var(--primary-color);">Bericht: "${req.message}"</small>` : ''}
                        </div>
                        <div style="font-size: 18px; font-weight: bold; color: var(--accent-color);">👍 ${req.votes}</div>
                    </div>
                `;
            });
        }

        setInterval(() => {
            let currentData = JSON.parse(localStorage.getItem('party_session_' + user.username));
            if(currentData) {
                partyData = currentData;
                renderLiveRequests();
            }
        }, 2000);
    </script>
</body>
</html>
