<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Verzoekjes Dashboard</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1, h2 { margin: 0; }

        .party-code-badge {
            background: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* Tandwiel Menu */
        .settings-container {
            position: relative;
        }

        .gear-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.2s;
        }

        .gear-btn:hover {
            transform: rotate(90deg);
        }

        .settings-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background: var(--card-bg);
            border: 1px solid var(--text-muted);
            border-radius: 8px;
            padding: 15px;
            width: 300px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .settings-dropdown.active {
            display: block;
        }

        .settings-dropdown label {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .settings-dropdown input, .settings-dropdown textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background: var(--bg);
            border: 1px solid var(--text-muted);
            color: var(--text);
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* Secties & Formulieren */
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            background: var(--bg);
            border: 1px solid var(--text-muted);
            color: var(--text);
            border-radius: 6px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button.danger {
            background: var(--danger);
        }
        button.danger:hover {
            background: #dc2626;
        }

        /* Verzoekjes Lijst */
        .request-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
        }

        .request-info {
            display: flex;
            flex-direction: column;
        }

        .request-title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .request-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .request-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .like-count {
            background: rgba(99, 102, 241, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>DJ Dashboard</h1>
            <p id="welcomeTextDisplay" style="margin: 5px 0 0 0; color: var(--text-muted);">Welkom bij het feest!</p>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div>
                <span style="font-size: 0.8rem; color: var(--text-muted); display: block;">Feestcode</span>
                <span class="party-code-badge" id="partyCode">------</span>
            </div>
            
            <!-- Tandwiel Menu -->
            <div class="settings-container">
                <button class="gear-btn" onclick="toggleSettings()" title="Instellingen">⚙️</button>
                <div class="settings-dropdown" id="settingsDropdown">
                    <h3>Instellingen</h3>
                    
                    <label for="welcomeInput">Welkomsttekst</label>
                    <textarea id="welcomeInput" rows="2" oninput="updateWelcomeText()"></textarea>

                    <label for="xmlUpload">XML Bestanden Uploaden</label>
                    <input type="file" id="xmlUpload" accept=".xml" onchange="handleXmlUpload(event)">

                    <label>Beheerde XML Bestanden</label>
                    <div id="xmlFileList" style="max-height: 100px; overflow-y: auto; margin-top: 5px; font-size: 0.9rem;">
                        <!-- Dynamisch geladen bestanden -->
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--text-muted); margin: 15px 0;">
                    
                    <button class="danger" style="width: 100%;" onclick="startNewParty()">Nieuw Feest Starten</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Handmatig Verzoekje Toevoegen -->
    <div class="card">
        <h2>Verzoekje Toevoegen</h2>
        <div class="form-group">
            <input type="text" id="manualSong" placeholder="Artiest - Nummer...">
            <button onclick="addManualRequest()">Toevoegen</button>
        </div>
    </div>

    <!-- Verzoekjes Overzicht -->
    <div class="card">
        <h2>Ingekomen Verzoekjes</h2>
        <div id="requestsList" style="margin-top: 15px;">
            <!-- Dynamische verzoekjes -->
        </div>
    </div>
</div>

<script>
    // Lokale State Simulatie (gebaseerd op de originele logica)
    let djCode = "DJ" + Math.floor(10 + Math.random() * 90); // Bijv. DJ45
    let partyCode = djCode + Math.floor(10 + Math.random() * 90); // 6-karakter code (bv. DJ4582)
    let welcomeMessage = "Welkom bij het feest! Vraag hier je favoriete nummers aan.";
    
    // Dummy verzoekjes met likes en aanvraagvolgorde (timestamp)
    let requests = [
        id = 1, { title: "Tiësto - Lethal Industry", likes: 5, timestamp: 1000 },
        { title: "Armin van Buuren - Blah Blah Blah", likes: 12, timestamp: 1005 },
        { title: "Hardwell - Spaceman", likes: 2, timestamp: 1010 }
    ];

    let xmlFiles = ["playlist_oud.xml", "feest_export.xml"];

    // Initialisatie
    document.getElementById("partyCode").innerText = partyCode;
    document.getElementById("welcomeInput").value = welcomeMessage;
    document.getElementById("welcomeTextDisplay").innerText = welcomeMessage;
    renderRequests();
    renderXmlList();

    // Toggle Tandwiel Menu
    function toggleSettings() {
        const dropdown = document.getElementById("settingsDropdown");
        dropdown.classList.toggle("active");
    }

    // Welkomsttekst aanpassen
    function updateWelcomeText() {
        welcomeMessage = document.getElementById("welcomeInput").value;
        document.getElementById("welcomeTextDisplay").innerText = welcomeMessage;
    }

    // Nieuw feest starten (Reset code en data)
    function startNewParty() {
        if(confirm("Weet je zeker dat je een nieuw feest wilt starten? Alle huidige verzoekjes worden gewist.")) {
            partyCode = djCode + Math.floor(10 + Math.random() * 90);
            document.getElementById("partyCode").innerText = partyCode;
            requests = [];
            renderRequests();
            toggleSettings();
            alert("Nieuw feest gestart! Nieuwe code: " + partyCode);
        }
    }

    // Handmatig verzoekje toevoegen door DJ
    function addManualRequest() {
        const input = document.getElementById("manualSong");
        if(input.value.trim() === "") return;

        requests.push({
            title: input.value,
            likes: 0,
            timestamp: Date.now()
        });

        input.value = "";
        renderRequests();
    }

    // XML Upload simulatie
    function handleXmlUpload(event) {
        const file = event.target.files[0];
        if(file) {
            xmlFiles.push(file.name);
            renderXmlList();
            alert("XML-bestand '" + file.name + "' succesvol geüpload.");
            event.target.value = "";
        }
    }

    // XML Bestand verwijderen
    function deleteXmlFile(index) {
        xmlFiles.splice(index, 1);
        renderXmlList();
    }

    function renderXmlList() {
        const listContainer = document.getElementById("xmlFileList");
        listContainer.innerHTML = "";
        xmlFiles.forEach((file, index) => {
            listContainer.innerHTML += `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                    <span>${file}</span>
                    <button class="danger" style="padding: 2px 6px; font-size: 0.8rem;" onclick="deleteXmlFile(${index})">X</button>
                </div>
            `;
        });
    }

    // Sorteren op Likes (aflopend) en daarna op Aanvraagvolgorde (oplopend / oudste eerst)
    function renderRequests() {
        const listContainer = document.getElementById("requestsList");
        
        // Sorteeralgoritme: Meeste likes eerst, bij gelijke likes wint de oudste aanvraag
        requests.sort((a, b) => {
            if (b.likes !== a.likes) {
                return b.likes - a.likes;
            }
            return a.timestamp - b.timestamp;
        });

        if (requests.length === 0) {
            listContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center;">Nog geen verzoekjes binnengekomen.</p>`;
            return;
        }

        listContainer.innerHTML = "";
        requests.forEach((req, index) => {
            listContainer.innerHTML += `
                <div class="request-item">
                    <div class="request-info">
                        <span class="request-title">${req.title}</span>
                        <span class="request-meta">Aanvraag #${index + 1}</span>
                    </div>
                    <div class="request-actions">
                        <span class="like-count">❤️ ${req.likes}</span>
                        <button class="danger" style="padding: 5px 10px; font-size: 0.8rem;" onclick="removeRequest(${index})">Verwijder</button>
                    </div>
                </div>
            `;
        });
    }

    function removeRequest(index) {
        requests.splice(index, 1);
        renderRequests();
    }
</script>

</body>
</html>
