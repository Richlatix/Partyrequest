<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partyrequest - Profiel & Bedrijf Dashboard</title>
    <script src="style.js"></script>
</head>
<body>
    <div class="container" style="padding-top: 40px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 id="pageTitle">Dashboard</h1>
            <button class="btn-primary" onclick="PartyApp.logout()" style="width: auto;">Uitloggen</button>
        </div>

        <!-- Alleen zichtbaar voor Bedrijven: Eigen DJ's aanmaken -->
        <div id="companySection" class="card" style="margin-bottom: 20px; display: none;">
            <h3>Bedrijfs-DJ's Aanmaken</h3>
            <form id="addDjForm">
                <label>DJ Gebruikersnaam:</label>
                <input type="text" id="djUsername" required>
                <label>DJ Wachtwoord:</label>
                <input type="password" id="djPassword" required>
                <button type="submit" class="btn-primary">DJ Toevoegen</button>
            </form>
            <div id="companyDjList" style="margin-top: 15px;"></div>
        </div>

        <!-- Huisstijl & Wachtwoord Beheren -->
        <div class="card">
            <h3>Instellingen & Huisstijl Beheren</h3>
            <form id="settingsForm">
                <label>Primair Huisstijl Kleur:</label>
                <input type="color" id="primaryColor" value="#ff3366" style="height: 45px; padding: 2px;">
                
                <label>Achtergrond Kleur:</label>
                <input type="color" id="bgColor" value="#0f0e17" style="height: 45px; padding: 2px;">

                <label>Nieuw Wachtwoord (optioneel):</label>
                <input type="password" id="newPassword" placeholder="Leeg laten om niet te wijzigen">

                <button type="submit" class="btn-primary">Wijzigingen Opslaan</button>
            </form>
        </div>
    </div>

    <script>
        const user = PartyApp.getCurrentUser();
        if (!user || (user.role !== 'company' && user.role !== 'solo_dj')) {
            window.location.href = 'login.html';
        }

        document.getElementById('pageTitle').innerText = user.role === 'company' ? `Bedrijf: ${user.username}` : `Solo DJ: ${user.username}`;
        
        if (user.role === 'company') {
            document.getElementById('companySection').style.display = 'block';
            loadCompanyDjs();
        }

        // Huisstijl inladen
        let settings = JSON.parse(localStorage.getItem('settings_' + user.username)) || { primaryColor: '#ff3366', backgroundColor: '#0f0e17' };
        document.getElementById('primaryColor').value = settings.primaryColor;
        document.getElementById('bgColor').value = settings.backgroundColor;
        PartyApp.applyBranding(settings);

        document.getElementById('settingsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            settings.primaryColor = document.getElementById('primaryColor').value;
            settings.backgroundColor = document.getElementById('bgColor').value;
            localStorage.setItem('settings_' + user.username, JSON.stringify(settings));
            PartyApp.applyBranding(settings);

            const newPass = document.getElementById('newPassword').value.trim();
            if (newPass) {
                let users = JSON.parse(localStorage.getItem('party_users')) || [];
                let target = users.find(u => u.username === user.username);
                if (target) {
                    target.password = newPass;
                    localStorage.setItem('party_users', JSON.stringify(users));
                }
            }
            alert('Instellingen succesvol opgeslagen!');
        });

        document.getElementById('addDjForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            const djUser = document.getElementById('djUsername').value.trim();
            const djPass = document.getElementById('djPassword').value.trim();

            let djs = JSON.parse(localStorage.getItem('company_djs_' + user.username)) || [];
            if(djs.some(d => d.username === djUser)) {
                alert('Deze DJ naam bestaat al binnen jouw bedrijf.');
                return;
            }

            djs.push({ username: djUser, password: djPass, company: user.username, role: 'company_dj' });
            localStorage.setItem('company_djs_' + user.username, JSON.stringify(djs));

            let users = JSON.parse(localStorage.getItem('party_users')) || [];
            users.push({ username: djUser, password: djPass, role: 'company_dj', company: user.username });
            localStorage.setItem('party_users', JSON.stringify(users));

            alert('Bedrijfs-DJ succesvol toegevoegd!');
            document.getElementById('djUsername').value = '';
            document.getElementById('djPassword').value = '';
            loadCompanyDjs();
        });

        function loadCompanyDjs() {
            let djs = JSON.parse(localStorage.getItem('company_djs_' + user.username)) || [];
            const list = document.getElementById('companyDjList');
            list.innerHTML = '<h4>Actieve Bedrijfs-DJ\'s:</h4>';
            if(djs.length === 0) {
                list.innerHTML += '<p style="color: #aaa;">Nog geen DJ\'s geregistreerd.</p>';
                return;
            }
            djs.forEach((dj) => {
                list.innerHTML += `<div style="background: #0f0e17; padding: 8px 12px; border-radius: 6px; margin-top: 5px;">${dj.username}</div>`;
            });
        }
    </script>
</body>
</html>
