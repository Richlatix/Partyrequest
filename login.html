<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Inloggen - Bedrijfspagina</title>
    <style>
        body { 
            font-family: Arial, sans-serif; /* Standaard lettertype */
            margin: 0; 
            padding: 0; 
            background: #f4f4f9; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .login-card { 
            background: #fff; 
            padding: 30px; 
            border-radius: 5px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 350px; 
            box-sizing: border-box; 
        }
        h2 { 
            margin-top: 0; 
            color: #007BFF; /* Vertrouwd blauw */
            text-align: center; 
            margin-bottom: 20px; 
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
        }
        input, select { 
            width: 100%; 
            padding: 8px; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }
        button { 
            background: #007BFF; /* Vaste blauwe kleur */
            color: white; 
            border: none; 
            padding: 10px; 
            width: 100%; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { 
            background: #0056b3; 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Inloggen</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Inloggen als:</label>
                <select id="rolKeuze">
                    <option value="bedrijf">Bedrijf / Solo DJ</option>
                    <option value="admin">Admin Dashboard</option>
                </select>
            </div>
            <div class="form-group">
                <label>E-mailadres:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Wachtwoord:</label>
                <input type="password" id="wachtwoord" required>
            </div>
            <button type="submit">Inloggen</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const rol = document.getElementById('rolKeuze').value;

            // Als admin is geselecteerd, ga naar admin.html, anders naar bedrijf.html
            if (rol === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'bedrijf.html';
            }
        });
    </script>

</body>
</html>
