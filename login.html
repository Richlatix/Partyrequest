<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen | DJ Verzoekjes Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        .admin-btn-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .btn-text {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-text:hover {
            border-color: var(--primary);
            color: var(--text);
            background-color: rgba(79, 70, 229, 0.1);
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button.primary-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.primary-btn:hover {
            background-color: var(--primary-hover);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.9rem;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Knop rechtsboven voor Admin Inlog -->
    <div class="admin-btn-container">
        <button id="toggle-admin-btn" class="btn-text">Admin Inlog</button>
    </div>

    <div class="login-card">
        <h1 id="form-title">⚡ Inloggen</h1>

        <!-- Formulier voor Bedrijven / DJ's (Stap 1: Bedrijfscodes invoeren) -->
        <form id="client-login-form">
            <div class="form-group">
                <label for="company-code">Bedrijfscode of Slug</label>
                <input type="text" id="company-code" required placeholder="Bijv. dj-tim">
            </div>
            <button type="submit" class="primary-btn" id="client-next-btn">Volgende</button>
        </form>

        <!-- Formulier voor Super Admin (Verschijnt als je rechtsboven klikt) -->
        <form id="admin-login-form" class="hidden">
            <div class="form-group">
                <label for="admin-password">Super Admin Wachtwoord</label>
                <input type="password" id="admin-password" required placeholder="Voer admin wachtwoord in">
            </div>
            <button type="submit" class="primary-btn">Inloggen als Admin</button>
        </form>

        <div id="error-msg" class="error-message"></div>
    </div>

    <script>
        // Supabase configuratie (Vervang deze met jouw gegevens)
        const SUPABASE_URL = 'JOUW_SUPABASE_PROJECT_URL';
        const SUPABASE_ANON_KEY = 'JOUW_SUPABASE_ANON_KEY';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const toggleAdminBtn = document.getElementById('toggle-admin-btn');
        const formTitle = document.getElementById('form-title');
        const clientLoginForm = document.getElementById('client-login-form');
        const adminLoginForm = document.getElementById('admin-login-form');
        const errorMsg = document.getElementById('error-msg');

        let isAdminMode = false;

        // Schakel tussen Client inlog en Admin inlog via de knop rechtsboven
        toggleAdminBtn.addEventListener('click', () => {
            isAdminMode = !isAdminMode;
            errorMsg.style.display = 'none';

            if (isAdminMode) {
                formTitle.innerText = '⚡ Super-Admin Inlog';
                clientLoginForm.classList.add('hidden');
                adminLoginForm.classList.remove('hidden');
                toggleAdminBtn.innerText = 'Terug naar Bedrijf Inlog';
                document.getElementById('admin-password').focus();
            } else {
                formTitle.innerText = '⚡ Inloggen';
                adminLoginForm.classList.add('hidden');
                clientLoginForm.classList.remove('hidden');
                toggleAdminBtn.innerText = 'Admin Inlog';
                document.getElementById('company-code').focus();
            }
        });

        // 1. Admin Inlog afhandelen
        adminLoginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('admin-password').value.trim();
            errorMsg.style.display = 'none';

            if (password === '3977') {
                sessionStorage.setItem('super_admin_logged_in', 'true');
                window.location.href = 'admin.html';
            } else {
                errorMsg.innerText = 'Onjuist admin wachtwoord.';
                errorMsg.style.display = 'block';
                document.getElementById('admin-password').value = '';
            }
        });

        // 2. Bedrijf / DJ Inlog afhandelen (Stap 1: Controleer of code bestaat)
        clientLoginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('company-code').value.trim().toLowerCase();
            const nextBtn = document.getElementById('client-next-btn');
            errorMsg.style.display = 'none';

            try {
                nextBtn.innerText = 'Controleren...';
                nextBtn.disabled = true;

                const { data, error } = await _supabase
                    .from('companies')
                    .select('*')
                    .eq('company_code', code)
                    .single();

                if (error || !data) {
                    throw new Error('Onbekende bedrijfscode');
                }

                // Check op verlopen abonnement
                if (data.expires_at) {
                    const expiresAt = new Date(data.expires_at);
                    if (new Date() > expiresAt) {
                        errorMsg.innerText = 'Dit abonnementsaccount is verlopen.';
                        errorMsg.style.display = 'block';
                        nextBtn.innerText = 'Volgende';
                        nextBtn.disabled = false;
                        return;
                    }
                }

                // Sla tijdelijk op welk bedrijf het is en stuur door naar een wachtwoordpagina (of latere stap)
                sessionStorage.setItem('pending_company_login', JSON.stringify({
                    id: data.id,
                    name: data.company_name,
                    code: data.company_code,
                    password: data.password
                }));

                // Stuur door naar een dedicated wachtwoordpagina voor dat bedrijf
                window.location.href = 'bedrijf-login.html';

            } catch (err) {
                errorMsg.innerText = 'Bedrijfscode niet gevonden.';
                errorMsg.style.display = 'block';
                nextBtn.innerText = 'Volgende';
                nextBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
