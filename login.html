<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partyrequest - Inloggen</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="style.js"></script>
</head>
<body>
    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
        <div class="card" style="width: 100%; max-width: 400px;">
            <h2 style="margin-bottom: 20px; text-align: center; color: var(--primary-color);">Inloggen</h2>
            <form id="loginForm">
                <label>Gebruikersnaam:</label>
                <input type="text" id="username" placeholder="Je gebruikersnaam" required>
                
                <label>Wachtwoord:</label>
                <input type="password" id="password" placeholder="Je wachtwoord" required>
                
                <button type="submit" class="btn-primary" style="margin-top: 10px;">Inloggen</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            try {
                const users = await PartyApp.db.getUsers();
                const foundUser = users.find(u => u.username === usernameInput && u.password === passwordInput);

                if (!foundUser) {
                    alert('Onjuiste gebruikersnaam of wachtwoord!');
                    return;
                }

                const now = new Date();

                // 1. Admin controle
                if (foundUser.role === 'admin') {
                    localStorage.setItem('party_current_user', JSON.stringify(foundUser));
                    window.location.href = 'admin.html';
                    return;
                }

                // 2. Abonnementscontrole voor Bedrijven en Solo DJ's
                if (foundUser.expires_at) {
                    const expDate = new Date(foundUser.expires_at);
                    if (expDate < now) {
                        alert('Dit abonnement is verlopen. Neem contact op met de beheerder.');
                        return;
                    }
                }

                // 3. Sub-DJ controle (check moederbedrijf)
                if (foundUser.role === 'company_dj' && foundUser.company) {
                    const parentUser = users.find(u => u.username === foundUser.company);
                    if (!parentUser) {
                        alert('Het moederbedrijf van dit DJ-account bestaat niet meer.');
                        return;
                    }
                    if (parentUser.expires_at) {
                        const parentExp = new Date(parentUser.expires_at);
                        if (parentExp < now) {
                            alert('Het abonnement van het moederbedrijf is verlopen. Inloggen is niet mogelijk.');
                            return;
                        }
                    }
                }

                // 4. Juiste redirect logica per rol
                localStorage.setItem('party_current_user', JSON.stringify(foundUser));
                
                if (foundUser.role === 'company' || foundUser.role === 'solo_dj') {
                    window.location.href = 'profiles.html';
                } else if (foundUser.role === 'company_dj') {
                    window.location.href = 'dj.html';
                } else {
                    window.location.href = 'dashboard.html';
                }

            } catch (err) {
                console.error('Inlogfout:', err);
                alert('Er ging iets mis bij het inloggen.');
            }
        });
    </script>
</body>
</html>
