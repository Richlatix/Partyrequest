<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Inloggen - Bedrijfspagina</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; margin: 0; }
        .login-box { background: #fff; padding: 30px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        .login-box div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007BFF; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Inloggen</h2>
        <form id="loginForm">
            <div>
                <label>E-mailadres:</label>
                <input type="email" id="email" required>
            </div>
            <div>
                <label>Wachtwoord:</label>
                <input type="password" id="wachtwoord" required>
            </div>
            <button type="submit">Inloggen</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Voorkom dat de pagina direct herlaadt

            // Hier komt normaal de controle met de database (of een beveiligde login-check).
            // Voor nu simuleren we een succesvolle login en sturen we door naar bedrijf.html:
            
            window.location.href = 'bedrijf.html';
        });
    </script>

</body>
</html>
