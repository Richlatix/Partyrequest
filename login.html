<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partyrequest - Inloggen</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .card { background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 8px; width: 100%; max-width: 350px; text-align:center; }
    .btn { background-color: #FF4081; color: #fff; border: none; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; font-size:16px; margin-top:10px; }
    input { margin: 10px 0; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; display: block; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Partyrequest</h1>
    <p>Inloggen voor Admin, Bedrijven & DJ's</p>
    <input type="email" id="email" placeholder="E-mailadres">
    <input type="password" id="password" placeholder="Wachtwoord">
    <button class="btn" onclick="submitLogin()">Inloggen</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    async function submitLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      await handleLogin(email, password);
    }
  </script>
</body>
</html>
