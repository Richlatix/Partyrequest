<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen | DJ Verzoekjes Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.9rem;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>⚡ Inloggen Platform</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="company-code-input">Bedrijfscode (Slug)</label>
                <input type="text" id="company-code-input" placeholder="Bijv. dj-tim (of laat leeg voor admin)">
            </div>
            <div class="form-group">
                <label for="password-input">Wachtwoord</label>
                <input type="password" id="password-input" required placeholder="Voer je wachtwoord in">
            </div>
            <button type="submit" id="login-btn">Inloggen</button>
            <div id="error-msg" class="error-message">Onjuiste gegevens of abonnement verlopen.</div>
        </form>
    </div>

    <script>
        // Supabase configuratie (Vervang deze met jouw gegevens)
        const SUPABASE_URL = 'JOUW_SUPABASE_PROJECT_URL';
        const SUPABASE_ANON_KEY = 'JOUW_SUPABASE_ANON_KEY';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const companyCode = document.getElementById('company-code-input').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password-input').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('login-btn');

            errorMsg.style.display = 'none';

            // 1. Check of het de Super-Admin is (wachtwoord 3977)
            if (passwordInput === '3977') {
                sessionStorage.setItem('super_admin_logged_in', 'true');
                window.location.href = 'admin.html';
                return;
            }

            // 2. Als het een bedrijf/DJ is, moet de bedrijfscode ingevuld zijn
            if (!companyCode) {
                errorMsg.innerText = 'Vul je bedrijfscode in.';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                loginBtn.innerText = 'Controleren...';
                loginBtn.disabled = true;

                // Zoek op bedrijfscode én wachtwoord in de database
                const { data, error } = await _supabase
                    .from('companies')
                    .select('*')
                    .eq('company_code', companyCode)
                    .eq('password', passwordInput)
                    .single();

                if (error || !data) {
                    throw new Error('Onjuiste combinatie');
                }

                // 3. Controleer of het abonnement is verlopen
                if (data.expires_at) {
                    const expiresAt = new Date(data.expires_at);
                    if (new Date() > expiresAt) {
                        errorMsg.innerText = 'Dit abonnementsaccount is verlopen.';
                        errorMsg.style.display = 'block';
                        loginBtn.innerText = 'Inloggen';
                        loginBtn.disabled = false;
                        return;
                    }
                }

                // 4. Sla de bedrijfsgegevens op voor hun dashboard
                sessionStorage.setItem('company_logged_in', JSON.stringify({
                    id: data.id,
                    name: data.company_name,
                    code: data.company_code,
                    type: data.account_type
                }));

                // Stuur door naar het bedrijfsdashboard
                window.location.href = 'dashboard.html';

            } catch (err) {
                errorMsg.innerText = 'Onjuiste bedrijfscode of wachtwoord.';
                errorMsg.style.display = 'block';
                loginBtn.innerText = 'Inloggen';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
