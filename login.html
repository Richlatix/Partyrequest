<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen | DJ Verzoekjes Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.9rem;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>⚡ Inloggen Platform</h1>
        <form id="login-form">
            <!-- Stap 1: Voer Code in -->
            <div class="form-group" id="step-code">
                <label for="code-input">Bedrijf-, DJ- of Admincode</label>
                <input type="text" id="code-input" required placeholder="Bijv. dj-tim of 3977">
                <button type="button" id="next-btn" style="margin-top: 16px;">Volgende</button>
            </div>

            <!-- Stap 2: Voer Wachtwoord in -->
            <div class="form-group hidden" id="step-password">
                <label id="password-label" for="password-input">Wachtwoord</label>
                <input type="password" id="password-input" placeholder="Voer je wachtwoord in">
                <button type="submit" id="login-btn" style="margin-top: 16px;">Inloggen</button>
            </div>

            <div id="error-msg" class="error-message"></div>
        </form>
    </div>

    <script>
        // Supabase configuratie (Vervang deze met jouw gegevens)
        const SUPABASE_URL = 'JOUW_SUPABASE_PROJECT_URL';
        const SUPABASE_ANON_KEY = 'JOUW_SUPABASE_ANON_KEY';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const codeInput = document.getElementById('code-input');
        const passwordInput = document.getElementById('password-input');
        const nextBtn = document.getElementById('next-btn');
        const stepCode = document.getElementById('step-code');
        const stepPassword = document.getElementById('step-password');
        const errorMsg = document.getElementById('error-msg');
        const passwordLabel = document.getElementById('password-label');

        let foundCompanyData = null;

        async function handleCodeCheck() {
            const code = codeInput.value.trim().toLowerCase();
            errorMsg.style.display = 'none';

            if (!code) {
                errorMsg.innerText = 'Vul een code in.';
                errorMsg.style.display = 'block';
                return;
            }

            // 1. Directe check voor Super-Admin code 3977
            if (code === '3977') {
                sessionStorage.setItem('super_admin_logged_in', 'true');
                window.location.href = 'admin.html';
                return;
            }

            try {
                nextBtn.innerText = 'Zoeken...';
                nextBtn.disabled = true;

                // Zoek of het bedrijf/de DJ bestaat in de database
                const { data, error } = await _supabase
                    .from('companies')
                    .select('*')
                    .eq('company_code', code)
                    .single();

                if (error || !data) {
                    throw new Error('Onbekende code');
                }

                // Controleer of het abonnement is verlopen
                if (data.expires_at) {
                    const expiresAt = new Date(data.expires_at);
                    if (new Date() > expiresAt) {
                        errorMsg.innerText = 'Dit abonnementsaccount is verlopen.';
                        errorMsg.style.display = 'block';
                        nextBtn.innerText = 'Volgende';
                        nextBtn.disabled = false;
                        return;
                    }
                }

                foundCompanyData = data;
                
                const typeText = data.account_type === 'bedrijf' ? 'Bedrijf' : 'Solo DJ';
                passwordLabel.innerText = `Wachtwoord voor ${data.company_name} (${typeText})`;

                stepCode.classList.add('hidden');
                stepPassword.classList.remove('hidden');
                passwordInput.focus();

            } catch (err) {
                errorMsg.innerText = 'Code niet gevonden of ongeldig.';
                errorMsg.style.display = 'block';
                nextBtn.innerText = 'Volgende';
                nextBtn.disabled = false;
            }
        }

        // Klik op de knop 'Volgende'
        nextBtn.addEventListener('click', handleCodeCheck);

        // Ook op Enter drukken in het code-veld werkt nu direct
        codeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleCodeCheck();
            }
        });

        // Stap 2: Controleer het wachtwoord voor bedrijven/DJ's
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const enteredPassword = passwordInput.value.trim();
            errorMsg.style.display = 'none';

            if (!foundCompanyData) return;

            if (enteredPassword === foundCompanyData.password) {
                sessionStorage.setItem('company_logged_in', JSON.stringify({
                    id: foundCompanyData.id,
                    name: foundCompanyData.company_name,
                    code: foundCompanyData.company_code,
                    type: foundCompanyData.account_type
                }));

                window.location.href = 'dashboard.html';
            } else {
                errorMsg.innerText = 'Onjuist wachtwoord.';
                errorMsg.style.display = 'block';
                passwordInput.value = '';
            }
        });
    </script>
</body>
</html>
